apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arbiter-hub-mcp.fullname" . }}
  labels:
    {{- include "arbiter-hub-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "arbiter-hub-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "arbiter-hub-mcp.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8500
              protocol: TCP
          env:
            - name: ARBITER_API_URL
              value: {{ .Values.api.url | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
