image:
  repository: registry.redhat.io/rhel10/postgresql-16
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5432

database:
  user: arbiter
  password: changeme
  name: arbiter

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
