---
# AAP Credential Type + Credential definitions for Arbiter Hub.
#
# Import: awx import < credentials.yaml
#
# Secrets are stored in AAP vault — never in git.
# Survey prompts inject values at workflow launch time;
# these credential objects provide the AAP-side plumbing.

credential_types:
  - name: "Arbiter Hub Secrets"
    description: "Custom credential type for Arbiter Hub demo secrets"
    kind: cloud
    inputs:
      fields:
        - id: ipa_admin_password
          type: string
          label: "IPA Admin Password"
          secret: true
        - id: db_password
          type: string
          label: "PostgreSQL Password"
          secret: true
        - id: oidc_client_secret
          type: string
          label: "OIDC Client Secret"
          secret: true
      required:
        - ipa_admin_password
        - db_password
        - oidc_client_secret
    injectors:
      extra_vars:
        ipaserver_admin_password: "{{ ipa_admin_password }}"
        vault_arbiter_db_password: "{{ db_password }}"
        arbiter_oidc_client_secret: "{{ oidc_client_secret }}"

credentials:
  # SSH key for IdM-CI provisioned hosts
  - name: "Arbiter - SSH Key"
    description: "SSH private key for IdM-CI provisioned Beaker hosts"
    credential_type: "Machine"
    organization: "RHEL Security"
    inputs:
      ssh_key_data: "{{ lookup('file', '~/.ssh/idm_ci_key') }}"
      username: root
    # In AAP UI: paste the key content or upload the file

  # IPA admin password (injected via extra_vars)
  - name: "Arbiter - IPA Admin"
    description: "FreeIPA admin password for ansible-freeipa modules"
    credential_type: "Arbiter Hub Secrets"
    organization: "RHEL Security"
    inputs:
      ipa_admin_password: "VAULT_MANAGED"

  # Database password
  - name: "Arbiter - Database"
    description: "PostgreSQL password for arbiter-hub backend"
    credential_type: "Arbiter Hub Secrets"
    organization: "RHEL Security"
    inputs:
      db_password: "VAULT_MANAGED"

  # OIDC client secret
  - name: "Arbiter - OIDC Secret"
    description: "ahdapa OAuth2 client secret for arbiter-hub OIDC"
    credential_type: "Arbiter Hub Secrets"
    organization: "RHEL Security"
    inputs:
      oidc_client_secret: "VAULT_MANAGED"

  # Quay robot account for container image pull/push
  - name: "Arbiter - Quay Robot"
    description: "Quay.io robot account for rhel-security org images"
    credential_type: "Container Registry"
    organization: "RHEL Security"
    inputs:
      host: "quay.io"
      username: "VAULT_MANAGED"
      password: "VAULT_MANAGED"
      verify_ssl: true

  # registry.redhat.io terms-based service account
  - name: "Arbiter - Registry Auth"
    description: "registry.redhat.io service account for RHEL base images"
    credential_type: "Container Registry"
    organization: "RHEL Security"
    inputs:
      host: "registry.redhat.io"
      username: "VAULT_MANAGED"
      password: "VAULT_MANAGED"
      verify_ssl: true
