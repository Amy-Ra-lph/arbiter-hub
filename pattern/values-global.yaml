---
# values-global.yaml — Shared configuration for all Arbiter Hub deployment targets
#
# This file is the single source of truth for every configurable value in the
# Arbiter Hub validated pattern. Site-specific overlays (values-hub.yaml for
# OpenShift, values-bare-metal.yaml for AAP) override selected keys.
#
# Secrets are marked "# vault-injected" — never commit actual values here.
# On AAP: use credential types. On OpenShift: use sealed-secrets or ESO.

# --- Global settings ---
global:
  # IPA domain — also used for DNS zone and Kerberos realm
  domain: arbiter.demo
  # Source repo cloned to all nodes during provisioning
  repo:
    url: https://github.com/Amy-Ra-lph/arbiter-hub.git
    branch: main
    clonePath: /opt/arbiter-hub

# --- Identity plane (IPA + ahdapa + akamu) ---
identity:
  ipaVersion: "4.14"
  adminPassword: ""  # vault-injected
  dnsForwarders:
    - 8.8.8.8
  # ahdapa native IdP (OAuth2/OIDC, ML-DSA-65 + ES256)
  ahdapa:
    oidcClientId: arbiter-hub
    oidcUiClientId: arbiter-hub-ui
    oidcClientSecret: ""  # vault-injected
    # API (confidential client) scopes
    apiScopes:
      - openid
      - profile
      - attestation-admin
      - attestation-operator
      - attestation-viewer
      - attestation-agent
      - attestation-pipeline
    # UI (public client) scopes
    uiScopes:
      - openid
      - profile
      - attestation-admin
      - attestation-operator
      - attestation-viewer
  # Demo personas provisioned via ipa-roles.yaml
  users:
    demoPassword: ""  # vault-injected
    personas:
      - name: alice
        groups: [attestation-admin]
      - name: bob
        groups: [attestation-operator]
      - name: carol
        groups: [attestation-viewer]
      - name: dave
        groups: [attestation-agent]
      - name: eve
        groups: [attestation-pipeline]
  # RBAC groups created on IPA server
  groups:
    - attestation-admin
    - attestation-operator
    - attestation-viewer
    - attestation-agent
    - attestation-pipeline
  # OBO delegation groups
  delegationGroups:
    - arbiter-hub-delegation
    - eda-delegation
    - agent-delegation

# --- Hub plane (API + UI + DB + MCP containers) ---
hub:
  images:
    api: quay.io/rhel-security/arbiter-hub-api:latest
    mcp: quay.io/rhel-security/arbiter-hub-mcp:latest
    ui: docker.io/library/nginx:alpine
    db: registry.redhat.io/rhel10/postgresql-16:latest
  database:
    user: arbiter
    name: arbiter
    password: ""  # vault-injected
  ports:
    api: 8400
    ui: 8080
    db: 5432
    mcp: 8500
  tls:
    enabled: true
    certDir: /etc/arbiter/certs
  # Cosign container image signing
  cosign:
    version: "2.4.1"
    keyDir: /etc/arbiter/cosign
    insecureIgnoreTlog: true
  # Container registry credentials (Quay robot account for cosign push)
  registry:
    quayRobotUser: ""  # vault-injected
    quayRobotToken: ""  # vault-injected
  # Seed policies loaded on first deploy
  seedPolicies: deploy/seed/policies.json
  # Quadlet network settings (bare-metal only, ignored on OpenShift)
  network:
    driver: bridge
    internal: false

# --- Attestation plane (Keylime + swtpm) ---
attestation:
  keylime:
    verifierPort: 8881
    registrarPort: 8891
    agentPort: 9002
    # CA certs generated by Keylime verifier
    certDir: /var/lib/keylime/cv_ca
    # Certs copied to hub for API mTLS with verifier
    hubCertDir: /etc/arbiter/keylime
  swtpm:
    port: 2321
    controlPort: 2322

# --- Agent plane (Falco + OpenShell + linux-mcp + demo workloads) ---
agent:
  falco:
    healthzPort: 8765
  openshell:
    enabled: true
  linuxMcp:
    enabled: true
  demoWorkloads:
    enabled: true

# --- EDA plane (ansible-rulebook + webhooks) ---
eda:
  javaPackage: java-21-openjdk-headless
  enabled: true

# --- Federation plane (SPIRE + OBO token exchange) ---
federation:
  spire:
    enabled: true
    svidTtl: 600
  obo:
    enabled: true

# --- Enforcement MCP (SELinux/fapolicyd/MLS/AIDE) ---
enforcementMcp:
  enabled: true
  port: 8100
