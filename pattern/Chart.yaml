apiVersion: v2
name: arbiter-hub-pattern
description: >-
  Hybrid validated pattern for Arbiter Hub federation attestation.
  Hub-plane (API, UI, DB, MCP, enforcement-mcp) deploys on OpenShift
  via ArgoCD. Agent-plane (Keylime, Falco, OpenShell, SPIRE) and
  identity-plane (IPA, ahdapa, akamu) deploy on bare-metal via AAP.
type: application
version: 0.1.0
appVersion: "1.0.0"
home: https://github.com/Amy-Ra-lph/arbiter-hub
maintainers:
  - name: Amy Ralph
    email: afarley@redhat.com
dependencies:
  - name: arbiter-hub-db
    version: "0.1.0"
    repository: "file://charts/arbiter-hub-db"
  - name: arbiter-hub-api
    version: "0.1.0"
    repository: "file://charts/arbiter-hub-api"
  - name: arbiter-hub-mcp
    version: "0.1.0"
    repository: "file://charts/arbiter-hub-mcp"
  - name: arbiter-hub-ui
    version: "0.1.0"
    repository: "file://charts/arbiter-hub-ui"
  - name: enforcement-mcp
    version: "0.1.0"
    repository: "file://charts/enforcement-mcp"
