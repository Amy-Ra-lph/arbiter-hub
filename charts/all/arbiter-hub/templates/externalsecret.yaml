---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-db-credentials
  labels:
    app.kubernetes.io/name: arbiter-hub
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.database.passwordSecret }}
    template:
      data:
        db_password: |-
          {{ "{{ .db_password }}" }}
        database_url: |-
          postgresql+asyncpg://{{ .Values.database.user }}:{{ "{{ .db_password }}" }}@{{ .Release.Name }}-db:5432/{{ .Values.database.name }}
  data:
    - secretKey: db_password
      remoteRef:
        key: secret/data/global/arbiter-db-credentials
        property: db_password
