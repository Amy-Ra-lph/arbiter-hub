---
apiVersion: v1
kind: Service
metadata:
  name: arbiter-hub-api
  labels:
    app.kubernetes.io/name: arbiter-hub-api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: arbiter-hub-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: {{ .Values.apiPort }}
      targetPort: api
    - name: mcp
      port: {{ .Values.mcpPort }}
      targetPort: mcp
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-db
  labels:
    app.kubernetes.io/name: arbiter-hub-db
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: arbiter-hub-db
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
