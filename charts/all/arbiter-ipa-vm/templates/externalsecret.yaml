apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "arbiter-ipa-vm.fullname" . }}-credentials
  labels:
    {{- include "arbiter-ipa-vm.labels" . | nindent 4 }}
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.adminPassword.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secrets.adminPassword.key }}
      remoteRef:
        key: {{ .Values.vault.path }}
        property: admin_password
    - secretKey: {{ .Values.secrets.dmPassword.key }}
      remoteRef:
        key: {{ .Values.vault.path }}
        property: dm_password
