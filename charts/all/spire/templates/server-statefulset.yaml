---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-server
  labels:
    app.kubernetes.io/name: spire-server
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}-server
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spire-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-server
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: spire-server
      containers:
        - name: spire-server
          image: {{ .Values.server.image }}
          args:
            - -config
            - /run/spire/config/server.conf
          ports:
            - containerPort: {{ .Values.server.port }}
              name: grpc
          volumeMounts:
            - name: spire-config
              mountPath: /run/spire/config
            - name: spire-data
              mountPath: /run/spire/data
            - name: socket
              mountPath: /tmp/spire-server/private
      volumes:
        - name: spire-config
          configMap:
            name: {{ .Release.Name }}-server-config
        - name: socket
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: spire-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
