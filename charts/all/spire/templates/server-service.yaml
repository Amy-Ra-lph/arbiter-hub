---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-server
  labels:
    app.kubernetes.io/name: spire-server
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: spire-server
  ports:
    - name: grpc
      port: {{ .Values.server.port }}
      targetPort: grpc
