---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ahdapa
  labels:
    app.kubernetes.io/name: ahdapa
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ahdapa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ahdapa
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: ahdapa
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.port }}
              name: https
          env:
            - name: AHDAPA_IPA_SERVER
              value: {{ .Values.ipaServer }}
            - name: AHDAPA_ISSUER_URL
              value: {{ .Values.issuerUrl }}
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
