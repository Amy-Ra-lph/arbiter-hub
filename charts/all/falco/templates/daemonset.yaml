---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-falco
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: falco
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falco
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostPID: true
      hostNetwork: true
      containers:
        - name: falco
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          securityContext:
            privileged: true
          env:
            - name: FALCO_BPF_PROBE
              value: ""
          volumeMounts:
            - name: dev
              mountPath: /host/dev
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: etc
              mountPath: /host/etc
              readOnly: true
            {{- if .Values.customRules.enabled }}
            - name: custom-rules
              mountPath: /etc/falco/rules.d
            {{- end }}
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: proc
          hostPath:
            path: /proc
        - name: etc
          hostPath:
            path: /etc
        {{- if .Values.customRules.enabled }}
        - name: custom-rules
          configMap:
            name: {{ .Values.customRules.configMapName }}
        {{- end }}
