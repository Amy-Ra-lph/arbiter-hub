---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-enforcement-mcp
  labels:
    app.kubernetes.io/name: enforcement-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: enforcement-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enforcement-mcp
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: enforcement-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.mcpPort }}
              name: mcp
          env:
            - name: MCP_PORT
              value: "{{ .Values.mcpPort }}"
          securityContext:
            privileged: true
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
