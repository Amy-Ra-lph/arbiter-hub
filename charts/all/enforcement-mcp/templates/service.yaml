---
apiVersion: v1
kind: Service
metadata:
  name: enforcement-mcp
  labels:
    app.kubernetes.io/name: enforcement-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: enforcement-mcp
  ports:
    - name: mcp
      port: {{ .Values.mcpPort }}
      targetPort: mcp
