---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-eda
  labels:
    app.kubernetes.io/name: eda-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eda-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eda-controller
        app.kubernetes.io/instance: {{ .Release.Name }}
        app: eda-controller
    spec:
      containers:
        - name: eda
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.webhookPort }}
              name: webhook
          env:
            - name: ARBITER_API_URL
              value: {{ .Values.arbiterApiUrl }}
            - name: ARBITER_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: webhook-secret
                  key: secret
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
