---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-webhook-secret
  labels:
    app.kubernetes.io/name: eda-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: webhook-secret
  data:
    - secretKey: secret
      remoteRef:
        key: secret/data/global/webhook-secret
        property: secret
