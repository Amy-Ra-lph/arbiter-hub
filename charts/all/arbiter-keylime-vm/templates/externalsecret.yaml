apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "arbiter-keylime-vm.fullname" . }}-tls
  labels:
    {{- include "arbiter-keylime-vm.labels" . | nindent 4 }}
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.tlsCa.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secrets.tlsCa.key }}
      remoteRef:
        key: {{ .Values.vault.path }}
        property: ca_cert
    - secretKey: {{ .Values.secrets.tlsCert.key }}
      remoteRef:
        key: {{ .Values.vault.path }}
        property: server_cert
    - secretKey: {{ .Values.secrets.tlsKey.key }}
      remoteRef:
        key: {{ .Values.vault.path }}
        property: server_key
