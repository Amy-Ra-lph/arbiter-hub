apiVersion: v1
kind: Service
metadata:
  name: {{ include "arbiter-keylime-vm.fullname" . }}
  labels:
    {{- include "arbiter-keylime-vm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "arbiter-keylime-vm.selectorLabels" . | nindent 4 }}
  ports:
    - name: verifier
      port: {{ .Values.keylime.verifierPort }}
      targetPort: {{ .Values.keylime.verifierPort }}
      protocol: TCP
    - name: registrar
      port: {{ .Values.keylime.registrarPort }}
      targetPort: {{ .Values.keylime.registrarPort }}
      protocol: TCP
