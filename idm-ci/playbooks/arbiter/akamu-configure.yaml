---
# akamu-configure.yaml — Initialize akamu ACME CA for the demo environment
# akamu RPM is installed via COPR abbra/modrnizer-darc with the IPA packages.
# This playbook runs `akamu init` for system-wide deployment and starts the service.
- name: Configure akamu ACME CA
  hosts: ipaserver
  become: true
  tasks:
    - name: Verify akamu is installed
      ansible.builtin.command:
        cmd: rpm -q akamu
      changed_when: false

    - name: Initialize akamu system config
      ansible.builtin.command:
        cmd: >-
          akamu init
          --system
          --base-url https://{{ ansible_fqdn }}/akamu
          --force
      args:
        creates: /etc/akamu/config.toml

    - name: Ensure akamu data directory permissions
      ansible.builtin.file:
        path: /var/lib/akamu
        state: directory
        owner: akamu
        group: akamu
        mode: "0750"
        recurse: true

    - name: Enable and restart akamu
      ansible.builtin.systemd:
        name: akamu
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Wait for akamu to be ready
      ansible.builtin.uri:
        url: "https://{{ ansible_fqdn }}/akamu/acme/directory"
        validate_certs: false
        return_content: true
      register: acme_directory
      retries: 15
      delay: 5
      until: acme_directory.status == 200
      ignore_errors: true

    - name: Report akamu status
      ansible.builtin.debug:
        msg: >-
          akamu ACME directory:
          {{ acme_directory.content | default('not available — check httpd proxy config') }}
