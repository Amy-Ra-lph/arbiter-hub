---
# ahdapa-configure.yaml — Register OAuth2 clients in ahdapa for Arbiter Hub
# ahdapa itself is installed and configured by the IPA installer (modrnizer-darc COPR).
# This playbook only registers the OAuth2 clients needed by the demo.
- name: Register ahdapa OAuth2 clients for Arbiter Hub
  hosts: ipaserver
  become: true
  vars:
    ahdapa_url: "https://{{ ansible_fqdn }}/idp"
    admin_password: "Secret123"
  tasks:
    - name: Verify ahdapa is running
      ansible.builtin.command:
        cmd: ipactl status
      changed_when: false
      register: ipa_status
      failed_when: "'ahdapa Service: RUNNING' not in ipa_status.stdout"

    - name: Obtain admin Kerberos ticket
      ansible.builtin.shell:
        cmd: echo "{{ admin_password }}" | kinit admin
      changed_when: false
      no_log: true

    - name: Check existing clients
      ansible.builtin.command:
        cmd: >-
          ahdapactl --url {{ ahdapa_url }} --kerberos --insecure
          clients list
      register: existing_clients
      changed_when: false

    - name: Register arbiter-hub API client
      ansible.builtin.command:
        cmd: >-
          ahdapactl --url {{ ahdapa_url }} --kerberos --insecure
          clients create
          --name arbiter-hub-api
          --redirect-uris "https://hub.arbiter.demo:8443/callback"
          --scopes "openid,profile,arbiter:admin"
          --grant-types "authorization_code,client_credentials"
          --generate-credentials client_secret
      register: arbiter_client
      when: "'arbiter-hub-api' not in existing_clients.stdout"

    - name: Save arbiter-hub client credentials
      ansible.builtin.copy:
        dest: /etc/ahdapa/arbiter-hub-client.env
        mode: "0600"
        content: |
          {{ arbiter_client.stdout | default('# client already registered') }}
      when: arbiter_client is changed

    - name: Register arbiter-hub UI client (public PKCE)
      ansible.builtin.command:
        cmd: >-
          ahdapactl --url {{ ahdapa_url }} --kerberos --insecure
          clients create
          --name arbiter-hub-ui
          --redirect-uris "https://hub.arbiter.demo:8443/,https://hub.arbiter.demo:8443/callback"
          --scopes "openid,profile"
          --grant-types "authorization_code"
          --auth-method none
      when: "'arbiter-hub-ui' not in existing_clients.stdout"

    - name: Verify OIDC discovery
      ansible.builtin.uri:
        url: "{{ ahdapa_url }}/.well-known/openid-configuration"
        validate_certs: false
        return_content: true
      register: oidc_discovery
      failed_when: "'token_endpoint' not in oidc_discovery.content"
