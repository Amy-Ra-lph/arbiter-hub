---
# ahdapa-configure.yaml — Register OAuth2 clients in ahdapa for Arbiter Hub
#
# ahdapa itself is installed by the IPA installer (modrnizer-darc COPR).
# This playbook registers OAuth2 clients via static TOML config and sets
# up CORS for browser-based OIDC token exchange.
#
# For full OIDC setup (groups, delegation rules, quadlet drop-ins), use
# oidc-configure.yaml which includes this playbook's functionality plus
# hub-side configuration.
- name: Register ahdapa OAuth2 clients for Arbiter Hub
  hosts: ipaserver
  become: true
  vars:
    arbiter_hub_fqdn: "{{ hostvars[groups['arbiter_hub'][0]]['inventory_hostname'] }}"
    arbiter_oidc_client_id: "arbiter-hub"
    arbiter_oidc_client_secret: ""
    arbiter_oidc_ui_client_id: "arbiter-hub-ui"
    arbiter_oidc_api_scopes:
      - openid
      - profile
      - attestation-admin
      - attestation-operator
      - attestation-viewer
      - attestation-agent
      - attestation-pipeline
    arbiter_oidc_ui_scopes:
      - openid
      - profile
      - attestation-admin
      - attestation-operator
      - attestation-viewer

  tasks:
    - name: Validate client secret is set
      ansible.builtin.assert:
        that:
          - arbiter_oidc_client_secret | length > 0
        fail_msg: "arbiter_oidc_client_secret must be set via -e or inventory"

    - name: Verify ahdapa is running
      ansible.builtin.command:
        cmd: ipactl status
      changed_when: false
      register: ipa_status
      failed_when: "'ahdapa Service: RUNNING' not in ipa_status.stdout"

    - name: Register Arbiter Hub clients in ahdapa clients.toml
      ansible.builtin.blockinfile:
        path: /etc/ahdapa/clients.toml
        marker: "# {mark} ANSIBLE MANAGED — Arbiter Hub OAuth2 clients"
        block: "{{ lookup('template', 'templates/ahdapa-arbiter-clients.toml.j2') }}"
      notify: Restart ahdapa

    - name: Deploy CORS config for browser OIDC token exchange
      ansible.builtin.template:
        src: templates/ipa-idp-cors.conf.j2
        dest: /etc/httpd/conf.d/ipa-idp-cors.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart httpd

    - name: Ensure OPTIONS preflight returns 204 in idp proxy
      ansible.builtin.blockinfile:
        path: /etc/httpd/conf.d/ipa-idp-proxy.conf
        insertafter: 'Require all granted'
        marker: "# {mark} ANSIBLE MANAGED — CORS OPTIONS preflight"
        block: |
          RewriteEngine On
          RewriteCond %{REQUEST_METHOD} =OPTIONS
          RewriteRule .* - [R=204,L]
      notify: Restart httpd

    - name: Add federation section to ahdapa.toml
      ansible.builtin.blockinfile:
        path: /etc/ahdapa/ahdapa.toml
        marker: "# {mark} ANSIBLE MANAGED — SPIFFE federation"
        block: |
          [federation]
          trusted_issuers     = ["https://{{ ansible_fqdn }}/spire"]
          trust_anchors       = []
          max_clock_skew_secs = 30
      notify: Restart ahdapa

    - name: Flush handlers (ahdapa must restart before ahdapactl calls)
      ansible.builtin.meta: flush_handlers

    - name: Login to ahdapactl
      ansible.builtin.command:
        cmd: ahdapactl login https://{{ ansible_fqdn }}/idp --kerberos --insecure
      changed_when: true

    - name: Create federation policies for SPIFFE workloads
      ansible.builtin.command:
        cmd: >-
          ahdapactl federation-policies create
          --issuer "https://{{ ansible_fqdn }}/spire"
          --subject-pattern "spiffe://{{ trust_domain }}/workload/{{ item.name }}"
          --local-sub "{{ item.principal }}"
          --scopes "openid"
          --priority 10
      loop:
        - { name: enforcement-mcp, principal: "enforcement-mcp/{{ arbiter_hub_fqdn }}" }
        - { name: linux-mcp, principal: "linux-mcp/{{ hostvars[groups['arbiter_agent'][0]]['inventory_hostname'] }}" }
      register: policy_result
      changed_when: "'key' in policy_result.stdout"
      failed_when: "policy_result.rc != 0 and 'duplicate_policy' not in policy_result.stderr"
      vars:
        trust_domain: "arbiter.demo"

    - name: Create Identity HBAC rule for federation token exchange
      ansible.builtin.command:
        cmd: >-
          ahdapactl hbac create
          --name "federation-token-exchange"
          --description "Allow SPIFFE federation token exchange for workload identities"
          --enabled true
          --user-category true
          --client-category true
          --scope-category true
          --network-category true
          --device-category true
          --mfa-bypass true
          --delegation-target-category true
      register: hbac_result
      changed_when: "'created' in hbac_result.stdout"
      failed_when: "hbac_result.rc != 0 and 'already exists' not in hbac_result.stderr"

    - name: Verify OIDC discovery
      ansible.builtin.uri:
        url: "https://{{ ansible_fqdn }}/idp/.well-known/openid-configuration"
        validate_certs: false
        return_content: true
      register: oidc_discovery
      failed_when: "'token_endpoint' not in oidc_discovery.content"

  handlers:
    - name: Restart ahdapa
      ansible.builtin.systemd:
        name: ahdapa
        state: restarted

    - name: Restart httpd
      ansible.builtin.systemd:
        name: httpd
        state: restarted
