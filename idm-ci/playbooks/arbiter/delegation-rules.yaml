---
# delegation-rules.yaml — Configure OBO delegation rules in IPA
# Allows arbiter-hub, EDA, and agent workloads to use token exchange (RFC 8693)
#
# Uses ansible-freeipa modules (ipagroup, ipadelegation) for idempotency.
- name: Configure OBO delegation rules
  hosts: ipaserver
  become: true
  vars:
    ipaadmin_password: "{{ ipaserver_admin_password | default('Secret123') }}"

  tasks:
    # --- Attestation RBAC groups ---
    - name: Create attestation RBAC groups
      ipagroup:
        ipaadmin_password: "{{ ipaadmin_password }}"
        name: "{{ item.name }}"
        description: "{{ item.desc }}"
        nonposix: true
        state: present
      loop:
        - { name: attestation-admin, desc: "Arbiter Hub administrators" }
        - { name: attestation-operator, desc: "Arbiter Hub operators" }
        - { name: attestation-viewer, desc: "Arbiter Hub viewers" }
        - { name: attestation-agent, desc: "Arbiter Hub agent workloads" }
        - { name: attestation-pipeline, desc: "Arbiter Hub CI/CD pipelines" }

    - name: Add admin user to attestation-admin group
      ipagroup:
        ipaadmin_password: "{{ ipaadmin_password }}"
        name: attestation-admin
        user:
          - admin
        action: member

    # --- OBO delegation groups ---
    - name: Create OBO delegation groups
      ipagroup:
        ipaadmin_password: "{{ ipaadmin_password }}"
        name: "{{ item.name }}"
        description: "{{ item.desc }}"
        nonposix: true
        state: present
      loop:
        - { name: arbiter-hub-delegation, desc: "Arbiter Hub OBO delegation" }
        - { name: eda-delegation, desc: "EDA controller OBO delegation" }
        - { name: agent-delegation, desc: "Agent workload OBO delegation" }

    # --- Delegation rules ---
    - name: Create OBO delegation rules
      ipadelegation:
        ipaadmin_password: "{{ ipaadmin_password }}"
        name: "{{ item.name }}"
        permission: read
        attribute:
          - uid
          - memberof
        group: "{{ item.group }}"
        membergroup: "{{ item.membergroup }}"
        state: present
      loop:
        - name: arbiter-hub-operator-delegation
          group: attestation-operator
          membergroup: arbiter-hub-delegation
        - name: eda-pipeline-delegation
          group: attestation-pipeline
          membergroup: eda-delegation
        - name: agent-service-delegation
          group: attestation-agent
          membergroup: agent-delegation

    - name: Verify delegation rules
      ansible.builtin.command:
        cmd: ipa delegation-find
      changed_when: false
      register: deleg_list

    - name: Display delegation rules
      ansible.builtin.debug:
        msg: "{{ deleg_list.stdout_lines }}"
