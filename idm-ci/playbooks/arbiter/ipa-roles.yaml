---
# ipa-roles.yaml — create IPA groups, roles, and HBAC services for arbiter-hub
# Runs on master (IPA server) after server install
- name: Configure IPA roles for arbiter-hub
  hosts: ipaserver
  become: true
  tasks:
    - name: Copy IPA role setup script
      ansible.builtin.copy:
        src: /opt/arbiter-hub/scripts/setup-ipa-roles.sh
        dest: /tmp/setup-ipa-roles.sh
        mode: "0755"
        remote_src: true

    - name: Obtain admin Kerberos ticket
      ansible.builtin.command:
        cmd: kinit admin
        stdin: "{{ ipaserver_admin_password }}"  # REQUIRED — set via ansible-vault or extra-vars
      changed_when: false

    - name: Run IPA role setup
      ansible.builtin.command:
        cmd: bash /tmp/setup-ipa-roles.sh {{ ipa_realm | default('ARBITER.DEMO') }}
      register: role_result
      changed_when: "'complete' in role_result.stdout"

    - name: Ensure marker directory exists
      ansible.builtin.file:
        path: /etc/arbiter
        state: directory
        mode: "0755"

    - name: Create demo user
      ansible.builtin.command:
        cmd: >-
          ipa user-add demo
          --first=Demo --last=User
          --password
        stdin: "redhat123\nredhat123"
      register: demo_user
      failed_when: false
      changed_when: "'Added user' in demo_user.stdout"

    - name: Create engineer user
      ansible.builtin.command:
        cmd: >-
          ipa user-add engineer
          --first=Security --last=Engineer
          --password
        stdin: "redhat123\nredhat123"
      register: engineer_user
      failed_when: false
      changed_when: "'Added user' in engineer_user.stdout"

    - name: Add demo user to arbiter-hub-delegation
      ansible.builtin.command:
        cmd: ipa group-add-member arbiter-hub-delegation --users=demo
      failed_when: false
      changed_when: true

    - name: Add engineer to all delegation groups
      ansible.builtin.command:
        cmd: "ipa group-add-member {{ item }} --users=engineer"
      loop:
        - arbiter-hub-delegation
        - eda-delegation
        - agent-delegation
      failed_when: false
      changed_when: true

    - name: Extend password expiry for demo users
      ansible.builtin.command:
        cmd: "ipa user-mod {{ item }} --setattr=krbPasswordExpiration=20271231000000Z"
      loop:
        - demo
        - engineer
      failed_when: false
      changed_when: true

    - name: Mark IPA roles as configured
      ansible.builtin.file:
        path: /etc/arbiter/.ipa-roles-configured
        state: touch
        mode: "0644"
