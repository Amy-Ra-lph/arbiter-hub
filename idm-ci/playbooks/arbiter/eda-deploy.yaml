---
# eda-deploy.yaml — Deploy EDA controller (ansible-rulebook) on hub node
# Runs attestation rulebook with custom arbiter_hub event source plugin.
# EDA files uploaded from controller (repo not cloned on remote).
- name: Deploy EDA controller
  hosts: arbiter_hub
  become: true
  vars:
    eda_dir: "/opt/arbiter-eda"
    eda_port: 5001
    arbiter_api_url: "http://localhost:8400"
    arbiter_webhook_secret: "{{ vault_arbiter_webhook_secret | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')) }}"
    agent_host: "{{ hostvars[groups['arbiter_agent'][0]]['ansible_default_ipv4']['address'] | default('agent.arbiter.demo') }}"
  tasks:
    - name: Install EDA dependencies
      ansible.builtin.dnf:
        name:
          - python3-pip
          - python3-devel
          - java-25-openjdk-headless
          - gcc
        state: present

    - name: Install ansible-rulebook and dependencies
      ansible.builtin.pip:
        name:
          - ansible-core
          - ansible-rulebook
          - aiohttp
          - ansible-runner
        state: present

    - name: Create EDA directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ eda_dir }}"
        - "{{ eda_dir }}/plugins"
        - "{{ eda_dir }}/plugins/event_source"
        - "{{ eda_dir }}/rulebooks"
        - "{{ eda_dir }}/playbooks"
        - "{{ eda_dir }}/inventory"

    - name: Upload EDA event source plugin
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../eda/plugins/event_source/arbiter_hub.py"
        dest: "{{ eda_dir }}/plugins/event_source/arbiter_hub.py"
        mode: "0644"

    - name: Create plugin __init__ files
      ansible.builtin.copy:
        content: ""
        dest: "{{ item }}"
        mode: "0644"
      loop:
        - "{{ eda_dir }}/plugins/__init__.py"
        - "{{ eda_dir }}/plugins/event_source/__init__.py"

    - name: Upload attestation rulebook
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../eda/rulebooks/attestation.yml"
        dest: "{{ eda_dir }}/rulebooks/attestation.yml"
        mode: "0644"

    - name: Upload demo rulebook
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../eda/rulebooks/demo.yml"
        dest: "{{ eda_dir }}/rulebooks/demo.yml"
        mode: "0644"

    - name: Upload remediation playbooks
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../eda/playbooks/{{ item }}"
        dest: "{{ eda_dir }}/playbooks/{{ item }}"
        mode: "0644"
      loop:
        - quarantine.yml
        - re_attest.yml
        - forensic_collect.yml

    - name: Create EDA inventory
      ansible.builtin.copy:
        dest: "{{ eda_dir }}/inventory/hosts.yml"
        mode: "0644"
        content: |
          ---
          all:
            vars:
              arbiter_api_url: {{ arbiter_api_url }}
              arbiter_webhook_secret: {{ arbiter_webhook_secret }}
            children:
              server:
                hosts:
                  hub.arbiter.demo:
                    ansible_connection: local
              client:
                hosts:
                  agent.arbiter.demo:
                    ansible_host: {{ agent_host }}

    - name: Create /etc/arbiter directory
      ansible.builtin.file:
        path: /etc/arbiter
        state: directory
        mode: "0755"

    - name: Store webhook secret
      ansible.builtin.copy:
        content: "{{ arbiter_webhook_secret }}"
        dest: /etc/arbiter/webhook-secret
        mode: "0600"

    - name: Create EDA systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/arbiter-eda.service
        mode: "0644"
        content: |
          [Unit]
          Description=Arbiter Hub EDA Controller (ansible-rulebook)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/ansible-rulebook \
            --rulebook {{ eda_dir }}/rulebooks/attestation.yml \
            --inventory {{ eda_dir }}/inventory/hosts.yml \
            --source-dir {{ eda_dir }}/plugins/event_source
          WorkingDirectory={{ eda_dir }}
          Environment=ARBITER_WEBHOOK_SECRET={{ arbiter_webhook_secret }}
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Start EDA controller
      ansible.builtin.systemd:
        name: arbiter-eda
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for EDA listener
      ansible.builtin.wait_for:
        port: "{{ eda_port }}"
        host: 0.0.0.0
        timeout: 60
        state: started
      ignore_errors: true

    - name: Verify EDA process running
      ansible.builtin.command:
        cmd: systemctl is-active arbiter-eda
      register: eda_status
      changed_when: false
      failed_when: false

    - name: Display EDA status
      ansible.builtin.debug:
        msg: >-
          EDA controller: {{ eda_status.stdout }}.
          Webhook listener: port {{ eda_port }}.
          Secret stored at /etc/arbiter/webhook-secret.
