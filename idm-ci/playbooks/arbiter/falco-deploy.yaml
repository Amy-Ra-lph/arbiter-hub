---
# falco-deploy.yaml — Deploy Falco eBPF runtime monitoring on agent node
#
# Installs Falco with eBPF driver (not kernel module), loads arbiter-specific
# rules, configures HTTP output to forward alerts to Arbiter Hub API.
- name: Deploy Falco runtime monitoring
  hosts: agent.arbiter.demo
  become: true
  vars:
    arbiter_hub_api: "http://hub.arbiter.demo:8400"
    arbiter_repo_dir: "/opt/arbiter-hub"
    falco_rules_dir: "/etc/falco/rules.d"
  tasks:
    - name: Install Falco GPG key
      ansible.builtin.rpm_key:
        key: https://falco.org/repo/falcosecurity-packages.asc
        state: present

    - name: Add Falco repository
      ansible.builtin.yum_repository:
        name: falcosecurity
        description: Falco Security
        baseurl: https://download.falco.org/packages/rpm/
        gpgcheck: true
        gpgkey: https://falco.org/repo/falcosecurity-packages.asc
        enabled: true

    - name: Install Falco and eBPF dependencies
      ansible.builtin.dnf:
        name:
          - falco
          - kernel-devel
          - clang
          - llvm
          - bpftool
        state: present

    - name: Create Falco rules directory
      ansible.builtin.file:
        path: "{{ falco_rules_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy arbiter-specific Falco rules
      ansible.builtin.copy:
        dest: "{{ falco_rules_dir }}/arbiter-rules.yaml"
        mode: "0644"
        content: |
          ---
          - rule: Arbiter Unexpected Process in Workload Container
            desc: Detects unexpected process execution inside attested workload containers
            condition: >-
              spawned_process and container and
              container.image.repository contains "arbiter" and
              not proc.name in (python3, uvicorn, gunicorn, bash, sh)
            output: >-
              Unexpected process in attested workload
              (container=%container.id process=%proc.name
               cmdline=%proc.cmdline user=%user.name
               image=%container.image.repository)
            priority: WARNING
            tags: [arbiter, workload, process]

          - rule: Arbiter Reverse Shell Detected
            desc: Detects reverse shell attempts from workload containers
            condition: >-
              spawned_process and container and
              container.image.repository contains "arbiter" and
              (proc.name in (nc, ncat, netcat, socat) or
               proc.cmdline contains "/dev/tcp" or
               proc.cmdline contains "bash -i")
            output: >-
              Reverse shell detected in attested workload
              (container=%container.id process=%proc.name
               cmdline=%proc.cmdline user=%user.name)
            priority: CRITICAL
            tags: [arbiter, workload, reverse-shell]

          - rule: Arbiter Sensitive File Access
            desc: Detects access to sensitive files from workload containers
            condition: >-
              open_read and container and
              container.image.repository contains "arbiter" and
              fd.name in (/etc/shadow, /etc/gshadow, /etc/sudoers,
                          /root/.ssh/id_rsa, /root/.ssh/authorized_keys)
            output: >-
              Sensitive file accessed in attested workload
              (container=%container.id file=%fd.name process=%proc.name
               user=%user.name image=%container.image.repository)
            priority: WARNING
            tags: [arbiter, workload, file-access]

    - name: Configure Falco for eBPF driver
      ansible.builtin.copy:
        dest: /etc/falco/config.d/arbiter.yaml
        mode: "0644"
        content: |
          engine:
            kind: ebpf

          http_output:
            enabled: true
            url: "{{ arbiter_hub_api }}/api/alerts/falco"
            user_agent: falco/arbiter-demo

          json_output: true
          json_include_output_property: true
          json_include_tags_property: true

          stdout_output:
            enabled: false

          syslog_output:
            enabled: false

          log_level: info

    - name: Start Falco service
      ansible.builtin.systemd:
        name: falco
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for Falco startup
      ansible.builtin.pause:
        seconds: 10

    - name: Verify Falco is running with eBPF
      ansible.builtin.command:
        cmd: falco --version
      register: falco_version
      changed_when: false

    - name: Verify Falco process is active
      ansible.builtin.command:
        cmd: systemctl is-active falco
      register: falco_status
      changed_when: false
      failed_when: falco_status.stdout != 'active'

    - name: Check Falco loaded arbiter rules
      ansible.builtin.command:
        cmd: grep -l "Arbiter" {{ falco_rules_dir }}/arbiter-rules.yaml
      register: rules_check
      changed_when: false
      failed_when: rules_check.rc != 0

    - name: Display Falco status
      ansible.builtin.debug:
        msg: >-
          Falco {{ falco_version.stdout }} running with eBPF driver.
          Arbiter rules loaded from {{ falco_rules_dir }}/arbiter-rules.yaml.
          HTTP output → {{ arbiter_hub_api }}/api/alerts/falco
