---
# e2e-test.yaml — E2E attestation flow tests for arbiter-hub
# Endpoints: /health (not /healthz), /workloads (no /api/v1/ prefix)
# KBS served by API on same port (no separate :8085)
- name: Run arbiter-hub E2E tests
  hosts: arbiter_hub
  become: true
  vars:
    api_url: "http://localhost:8400"
  tasks:
    - name: "T1: API health endpoint"
      ansible.builtin.uri:
        url: "{{ api_url }}/health"
        method: GET
        status_code: 200
      register: t1

    - name: "T2: KBS health (served by API)"
      ansible.builtin.uri:
        url: "{{ api_url }}/kbs/v0/health"
        method: GET
        status_code: 200
      register: t2

    - name: "T3: Register test workload"
      ansible.builtin.uri:
        url: "{{ api_url }}/workloads"
        method: POST
        body_format: json
        body:
          name: "test-workload-e2e"
          ipa_principal: "service/test-e2e@ARBITER.DEMO"
          display_name: "E2E Test Workload"
          workload_type: "service"
          backend_types:
            - keylime
        status_code: [200, 201, 409]
      register: t3

    - name: "T4: List workloads"
      ansible.builtin.uri:
        url: "{{ api_url }}/workloads"
        method: GET
        status_code: 200
        return_content: true
      register: t4

    - name: "T4: Verify workloads exist"
      ansible.builtin.assert:
        that:
          - t4.json.total > 0
        fail_msg: "No workloads registered"

    - name: "T5: Set workload ID"
      ansible.builtin.set_fact:
        test_workload_id: "{{ t3.json.id if t3.status == 201 else t4.json['items'][0]['id'] }}"

    - name: "T5: Get workload by ID"
      ansible.builtin.uri:
        url: "{{ api_url }}/workloads/{{ test_workload_id }}"
        method: GET
        status_code: 200
      register: t5

    - name: "T6: Request attestation"
      ansible.builtin.uri:
        url: "{{ api_url }}/workloads/{{ test_workload_id }}/attest"
        method: POST
        status_code: [200, 202, 500]
      register: t6

    - name: "T6: Check attestation response"
      ansible.builtin.debug:
        msg: "Attestation status={{ t6.status }}, body={{ t6.json | default('no json') }}"

    - name: "T7: List attestation history"
      ansible.builtin.uri:
        url: "{{ api_url }}/workloads/{{ test_workload_id }}/attestations"
        method: GET
        status_code: [200, 404]
      register: t7

    - name: "T8: Check audit log"
      ansible.builtin.uri:
        url: "{{ api_url }}/audit"
        method: GET
        status_code: [200, 404]
      register: t8

    - name: "T9: Store secret in KBS"
      ansible.builtin.uri:
        url: "{{ api_url }}/kbs/v0/resource/default/test/e2e-secret"
        method: POST
        body_format: json
        body:
          value: "test-secret-value-2026"
        status_code: [200, 201, 405, 422]
      register: t9

    - name: "T10: Retrieve secret from KBS"
      ansible.builtin.uri:
        url: "{{ api_url }}/kbs/v0/resource/default/test/e2e-secret"
        method: GET
        status_code: [200, 404]
        return_content: true
      register: t10

    - name: "T11: Check backends endpoint"
      ansible.builtin.uri:
        url: "{{ api_url }}/backends"
        method: GET
        status_code: [200, 404]
      register: t11

    - name: "T12: Check policies endpoint"
      ansible.builtin.uri:
        url: "{{ api_url }}/policies"
        method: GET
        status_code: [200, 404]
      register: t12

    - name: Test summary
      ansible.builtin.debug:
        msg: >-
          E2E results:
          T1 health={{ t1.status }},
          T2 kbs={{ t2.status }},
          T3 register={{ t3.status }},
          T4 list={{ t4.json.total }} workloads,
          T5 get={{ t5.status }},
          T6 attest={{ t6.status }},
          T7 history={{ t7.status }},
          T8 audit={{ t8.status }},
          T9 kbs-store={{ t9.status }},
          T10 kbs-get={{ t10.status }},
          T11 backends={{ t11.status }},
          T12 policies={{ t12.status }}
