---
# demo-agents-deploy.yaml — Deploy governed + rogue demo agents with honeypot canaries
#   governed_agent.py — well-behaved, uses OAuth2 tokens, respects sandbox
#   rogue_agent.py    — attempts credential theft, exfil, reverse shell (triggers Falco)
- name: Deploy demo agents and honeypot canaries
  hosts: arbiter_agent
  become: true
  vars:
    demo_dir: /opt/demo
    exfil_host: "{{ hostvars[groups['ipaserver'][0]]['ansible_fqdn'] }}"
    exfil_port: 9443
    agentic_repo: "{{ playbook_dir }}/../../../"
  tasks:
    - name: Create demo directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ demo_dir }}/agents"
        - "{{ demo_dir }}/output"

    - name: Upload agent scripts from local repo
      ansible.builtin.copy:
        src: "{{ agentic_repo }}/demo/agents/{{ item }}"
        dest: "{{ demo_dir }}/agents/{{ item }}"
        mode: "0755"
      loop:
        - governed_agent.py
        - rogue_agent.py
      ignore_errors: true

    - name: Patch rogue agent exfil URL
      ansible.builtin.lineinfile:
        path: "{{ demo_dir }}/agents/rogue_agent.py"
        regexp: 'DEFAULT_EXFIL_URL'
        line: 'DEFAULT_EXFIL_URL = "https://{{ exfil_host }}:{{ exfil_port }}/exfil"'
      ignore_errors: true

    - name: Install requests module for agents
      ansible.builtin.pip:
        name: requests
        state: present

    - name: Ensure .aws directory exists
      ansible.builtin.file:
        path: /root/.aws
        state: directory
        mode: "0700"

    - name: Plant honeypot AWS credentials
      ansible.builtin.copy:
        content: |
          [default]
          aws_access_key_id = AKIADEMOCANARY00001
          aws_secret_access_key = DEMO-CANARY-DO-NOT-USE-wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          region = us-east-1
        dest: /root/.aws/credentials
        mode: "0600"

    - name: Plant honeypot SSH key
      ansible.builtin.command:
        cmd: >-
          ssh-keygen -t rsa -b 2048 -f /root/.ssh/id_rsa_canary
          -N "" -C "DEMO-CANARY-DO-NOT-USE" -q
        creates: /root/.ssh/id_rsa_canary

    - name: Ensure .kube directory exists
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: "0700"

    - name: Plant honeypot kubeconfig
      ansible.builtin.copy:
        content: |
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://demo-cluster.example.com:6443
              certificate-authority-data: DEMO-CANARY-DO-NOT-USE
            name: demo-canary
          contexts:
          - context:
              cluster: demo-canary
              user: demo-canary-admin
            name: demo-canary
          current-context: demo-canary
          users:
          - name: demo-canary-admin
            user:
              token: DEMO-CANARY-DO-NOT-USE-eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9
        dest: /root/.kube/config
        mode: "0600"

    - name: Display canary status
      ansible.builtin.debug:
        msg: >-
          Honeypot canaries deployed:
          - /root/.aws/credentials (fake AWS creds)
          - /root/.ssh/id_rsa_canary (fake SSH key)
          - /root/.kube/config (fake kubeconfig)
          Agent scripts at {{ demo_dir }}/agents/
