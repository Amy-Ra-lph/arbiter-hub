---
# demo-agents-deploy.yaml — Deploy governed + rogue demo agents with honeypot canaries
# From agentic-security-platform: agents that demonstrate trust tier enforcement
#   governed_agent.py — well-behaved, uses OAuth2 tokens, respects sandbox
#   rogue_agent.py    — attempts credential theft, exfil, reverse shell (triggers Falco)
- name: Deploy demo agents and honeypot canaries
  hosts: agent.arbiter.demo
  become: true
  vars:
    platform_dir: /opt/agentic-platform
    demo_dir: /opt/demo
    exfil_host: "{{ hostvars[groups['ipaserver'][0]]['ansible_fqdn'] }}"
    exfil_port: 9443
  tasks:
    - name: Create demo directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ demo_dir }}/agents"
        - "{{ demo_dir }}/output"

    - name: Deploy agent scripts from agentic-security-platform
      ansible.builtin.copy:
        src: "{{ platform_dir }}/deploy/agents/{{ item }}"
        dest: "{{ demo_dir }}/agents/{{ item }}"
        mode: "0755"
        remote_src: true
      loop:
        - governed_agent.py
        - rogue_agent.py

    - name: Patch rogue agent exfil URL
      ansible.builtin.lineinfile:
        path: "{{ demo_dir }}/agents/rogue_agent.py"
        regexp: 'DEFAULT_EXFIL_URL'
        line: 'DEFAULT_EXFIL_URL = "https://{{ exfil_host }}:{{ exfil_port }}/exfil"'

    - name: Install requests module for rogue agent
      ansible.builtin.pip:
        name: requests
        state: present

    # Honeypot canaries — planted credentials that trigger alerts when accessed
    - name: Ensure .aws directory exists
      ansible.builtin.file:
        path: /root/.aws
        state: directory
        mode: "0700"

    - name: Plant honeypot AWS credentials
      ansible.builtin.copy:
        content: |
          [default]
          aws_access_key_id = AKIADEMOCANARY00001
          aws_secret_access_key = DEMO-CANARY-DO-NOT-USE-wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          region = us-east-1
        dest: /root/.aws/credentials
        mode: "0600"

    - name: Plant honeypot SSH key
      ansible.builtin.command:
        cmd: >-
          ssh-keygen -t rsa -b 2048 -f /root/.ssh/id_rsa
          -N "" -C "DEMO-CANARY-DO-NOT-USE" -q
        creates: /root/.ssh/id_rsa

    - name: Ensure .kube directory exists
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: "0700"

    - name: Plant honeypot kubeconfig
      ansible.builtin.copy:
        content: |
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://demo-cluster.example.com:6443
              certificate-authority-data: DEMO-CANARY-DO-NOT-USE
            name: demo-canary
          contexts:
          - context:
              cluster: demo-canary
              user: demo-canary-admin
            name: demo-canary
          current-context: demo-canary
          users:
          - name: demo-canary-admin
            user:
              token: DEMO-CANARY-DO-NOT-USE-eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9
        dest: /root/.kube/config
        mode: "0600"

    - name: Verify agent scripts deployed
      ansible.builtin.command:
        cmd: python3 -c "import ast; ast.parse(open('{{ demo_dir }}/agents/{{ item }}').read())"
      loop:
        - governed_agent.py
        - rogue_agent.py
      changed_when: false
