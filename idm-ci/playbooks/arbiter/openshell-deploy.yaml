---
# openshell-deploy.yaml — Deploy OpenShell gateway + supervisor on agent node
#
# Uses container images (not pip) with GSSAPI auth against IPA.
# Gateway on port 8443, supervisor manages sandbox sessions.
- name: Deploy OpenShell containers
  hosts: arbiter_agent
  become: true
  vars:
    openshell_gateway_image: "localhost/openshell-gateway:0.0.111-rhhi"
    openshell_supervisor_image: "localhost/openshell-supervisor:0.0.111-rhhi"
    openshell_gateway_port: 8443
    openshell_config_dir: "/etc/openshell"
    openshell_data_dir: "/var/lib/openshell"
    ipa_server: "{{ hostvars[groups['ipaserver'][0]]['ansible_fqdn'] }}"
  tasks:
    - name: Install runtime dependencies
      ansible.builtin.dnf:
        name:
          - podman
          - krb5-workstation
        state: present

    - name: Create config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ openshell_config_dir }}"
        - "{{ openshell_data_dir }}"
        - "{{ openshell_data_dir }}/sandboxes"

    - name: Deploy gateway configuration
      ansible.builtin.copy:
        dest: "{{ openshell_config_dir }}/gateway.yaml"
        mode: "0644"
        content: |
          gateway:
            host: 0.0.0.0
            port: {{ openshell_gateway_port }}
            tls:
              cert: /etc/pki/tls/certs/{{ ansible_fqdn }}.crt
              key: /etc/pki/tls/private/{{ ansible_fqdn }}.key

          auth:
            method: gssapi
            keytab: /etc/krb5.keytab
            service: HTTP/{{ ansible_fqdn }}

          sandbox:
            runtime: podman
            network_mode: slirp4netns
            memory_limit: 512m
            cpu_limit: "1.0"
            read_only: true
            data_dir: /var/lib/openshell/sandboxes

          supervisor:
            max_sessions: 10
            idle_timeout: 3600
            health_check_interval: 30

    - name: Request IPA service principal for OpenShell
      ansible.builtin.command:
        cmd: ipa service-add HTTP/{{ ansible_fqdn }}
      register: svc_add
      changed_when: svc_add.rc == 0
      failed_when: svc_add.rc != 0 and 'already exists' not in svc_add.stderr
      delegate_to: "{{ ipa_server }}"

    - name: Retrieve keytab for OpenShell service
      ansible.builtin.command:
        cmd: >-
          ipa-getkeytab -s {{ ipa_server }}
          -p HTTP/{{ ansible_fqdn }}
          -k /etc/krb5.keytab
      args:
        creates: /etc/krb5.keytab

    - name: Check if OpenShell images exist
      ansible.builtin.command:
        cmd: podman image exists {{ item }}
      loop:
        - "{{ openshell_gateway_image }}"
        - "{{ openshell_supervisor_image }}"
      register: image_check
      failed_when: false
      changed_when: false

    - name: Report missing images
      ansible.builtin.debug:
        msg: >-
          OpenShell images need to be transferred to this node.
          Missing: {{ image_check.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}
      when: image_check.results | selectattr('rc', 'ne', 0) | list | length > 0

    - name: Create OpenShell gateway container
      ansible.builtin.command:
        cmd: >-
          podman create --name openshell-gateway
          --publish {{ openshell_gateway_port }}:{{ openshell_gateway_port }}
          --volume {{ openshell_config_dir }}:/etc/openshell:ro
          --volume /etc/krb5.keytab:/etc/krb5.keytab:ro
          --volume /etc/pki/tls:/etc/pki/tls:ro
          --volume {{ openshell_data_dir }}:/var/lib/openshell
          --restart on-failure
          {{ openshell_gateway_image }}
      register: gw_create
      changed_when: gw_create.rc == 0
      failed_when: gw_create.rc != 0 and 'already in use' not in gw_create.stderr

    - name: Start OpenShell gateway container
      ansible.builtin.command:
        cmd: podman start openshell-gateway
      register: gw_start
      changed_when: gw_start.rc == 0
      failed_when: gw_start.rc != 0 and 'already running' not in gw_start.stderr

    - name: Create OpenShell supervisor container
      ansible.builtin.command:
        cmd: >-
          podman create --name openshell-supervisor
          --volume {{ openshell_config_dir }}:/etc/openshell:ro
          --volume /run/podman/podman.sock:/run/podman/podman.sock
          --volume {{ openshell_data_dir }}:/var/lib/openshell
          --restart on-failure
          {{ openshell_supervisor_image }}
      register: sv_create
      changed_when: sv_create.rc == 0
      failed_when: sv_create.rc != 0 and 'already in use' not in sv_create.stderr

    - name: Start OpenShell supervisor container
      ansible.builtin.command:
        cmd: podman start openshell-supervisor
      register: sv_start
      changed_when: sv_start.rc == 0
      failed_when: sv_start.rc != 0 and 'already running' not in sv_start.stderr

    - name: Wait for OpenShell gateway health
      ansible.builtin.command:
        cmd: >-
          curl -sk https://localhost:{{ openshell_gateway_port }}/health
      register: gw_health
      retries: 15
      delay: 5
      until: gw_health.rc == 0 and 'ok' in gw_health.stdout
      changed_when: false
      ignore_errors: true

    - name: Display OpenShell status
      ansible.builtin.command:
        cmd: podman ps --filter name=openshell --format "{{ '{{' }}.Names{{ '}}' }} {{ '{{' }}.Status{{ '}}' }}"
      register: os_status
      changed_when: false

    - name: Show status
      ansible.builtin.debug:
        var: os_status.stdout_lines
