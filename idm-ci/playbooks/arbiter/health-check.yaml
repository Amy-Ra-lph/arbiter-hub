---
# health-check.yaml — wait for all arbiter-hub containers to be healthy
# API serves /health (not /healthz). KBS routes served by API (no separate container).
- name: Wait for arbiter-hub services
  hosts: arbiter_hub
  become: true
  tasks:
    - name: Wait for arbiter-hub-api health
      ansible.builtin.command:
        cmd: >-
          podman exec arbiter-hub-api
          python3.12 -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8400/health', timeout=5); print(r.read().decode())"
      register: api_health
      until: api_health.rc == 0
      retries: 15
      delay: 5
      changed_when: false

    - name: Wait for arbiter-hub-mcp health
      ansible.builtin.command:
        cmd: >-
          podman exec arbiter-hub-mcp
          python3.12 -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8401/health', timeout=5); print(r.read().decode())"
      register: mcp_health
      until: mcp_health.rc == 0
      retries: 15
      delay: 5
      changed_when: false

    - name: Report container status
      ansible.builtin.command:
        cmd: podman ps --format "{{ '{{' }}.Names{{ '}}' }} {{ '{{' }}.Status{{ '}}' }}"
      register: container_status
      changed_when: false

    - name: Display status
      ansible.builtin.debug:
        var: container_status.stdout_lines
