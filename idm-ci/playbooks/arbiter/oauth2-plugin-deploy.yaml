---
# oauth2-plugin-deploy.yaml — Configure ahdapa OAuth2 clients and scopes
# Uses ahdapactl CLI (not ahdapa-client-register which doesn't exist).
# Issuer is https://<fqdn>/idp (not /ahdapa).
- name: Configure ahdapa OAuth2 for arbiter-hub
  hosts: ipaserver
  become: true
  vars:
    ipa_admin_password: "{{ ipaserver_admin_password }}"
    hub_fqdn: "{{ hostvars[groups['arbiter_hub'][0]]['ansible_fqdn'] | default('hub.arbiter.demo') }}"
    ahdapa_url: "https://{{ ansible_fqdn }}/idp"
  tasks:
    - name: Obtain admin Kerberos ticket
      ansible.builtin.command:
        cmd: kinit admin
        stdin: "{{ ipa_admin_password }}"
      changed_when: false

    - name: Login to ahdapa
      ansible.builtin.command:
        cmd: ahdapactl login {{ ahdapa_url }} --kerberos --insecure
      register: ahdapa_login
      changed_when: "'logged in' in ahdapa_login.stdout"
      failed_when: ahdapa_login.rc != 0 and 'already logged in' not in ahdapa_login.stderr

    - name: List existing clients
      ansible.builtin.command:
        cmd: ahdapactl clients list
      register: existing_clients
      changed_when: false

    - name: Create EDA controller client (if missing)
      ansible.builtin.command:
        cmd: >-
          ahdapactl clients create
          --name "EDA Controller"
          --redirect-uris "https://{{ hub_fqdn }}:5001/auth/callback"
          --grant-types "client_credentials"
          --generate-credentials client_secret
          --scopes "arbiter:attest,arbiter:enroll"
      register: eda_client
      when: "'EDA Controller' not in existing_clients.stdout"

    - name: Save EDA client credentials
      ansible.builtin.copy:
        content: "{{ eda_client.stdout }}"
        dest: /etc/arbiter/eda-client-credentials
        mode: "0600"
      when: eda_client is changed

    - name: Create arbiter scopes (idempotent via update)
      ansible.builtin.command:
        cmd: >-
          ahdapactl scopes update
          --description "{{ item.desc }}"
          {{ item.name }}
      loop:
        - { name: "arbiter:attest", desc: "Request and view attestation results" }
        - { name: "arbiter:enroll", desc: "Register and manage workloads" }
        - { name: "arbiter:admin", desc: "Full administrative access" }
        - { name: "arbiter:view", desc: "Read-only access to workloads and attestation" }
      register: scope_result
      changed_when: scope_result.rc == 0

    - name: Verify clients registered
      ansible.builtin.command:
        cmd: ahdapactl clients list
      register: final_clients
      changed_when: false

    - name: Display registered clients
      ansible.builtin.debug:
        var: final_clients.stdout_lines
