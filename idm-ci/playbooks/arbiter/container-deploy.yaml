---
# container-deploy.yaml — Deploy arbiter-hub containers via Quadlet
#
# Lessons from deployment (2026-10-17/18/20):
#   - RHEL PostgreSQL uses POSTGRESQL_* env vars, volume /var/lib/pgsql/data, uid 26
#   - Volume needs :Z,U flag (:U sets ownership to container uid)
#   - API uses pydantic-settings with env_prefix="ARBITER_" — one ARBITER_DATABASE_URL
#   - KBS routes served by API — no separate KBS container needed
#   - Alembic migration must run on same podman network to reach DB
#   - MCP env var is ARBITER_API_URL (not API_URL)
#   - Quadlet auto-prefixes network name with "systemd-" (e.g. systemd-arbiter-hub)
#   - alembic.ini hardcodes localhost; must sed-patch before running migration
#   - registry.redhat.io requires podman login (terms-based service account)
#   - Network Internal=false needed for verifier connectivity across hosts
#   - Keylime verifier TLS cert uses hostname, not IP — AddHost required
- name: Deploy arbiter-hub containers
  hosts: arbiter_hub
  become: true
  vars:
    arbiter_api_image: "quay.io/rhel-security/arbiter-hub-api:latest"
    arbiter_mcp_image: "quay.io/rhel-security/arbiter-hub-mcp:latest"
    arbiter_ui_image: "docker.io/library/nginx:alpine"
    arbiter_db_image: "registry.redhat.io/rhel10/postgresql-16:latest"
    arbiter_db_password: "{{ vault_arbiter_db_password }}"
    arbiter_db_user: "arbiter"
    arbiter_db_name: "arbiter"
    arbiter_keylime_verifier_host: "{{ hostvars[groups['ipaserver'][0]]['ansible_fqdn'] }}"
    arbiter_keylime_verifier_ip: "{{ hostvars[groups['ipaserver'][0]]['ansible_default_ipv4']['address'] }}"
    arbiter_keylime_verifier_url: "https://{{ arbiter_keylime_verifier_host }}:8881"
    arbiter_agent_host: "{{ hostvars[groups['arbiter_agent'][0]]['ansible_fqdn'] | default('agent.arbiter.demo') }}"
    arbiter_agent_ip: "{{ hostvars[groups['arbiter_agent'][0]]['ansible_default_ipv4']['address'] }}"
    arbiter_falco_healthz_url: "http://{{ arbiter_agent_host }}:8765/healthz"
    arbiter_cert_dir: "/etc/arbiter/keylime"
    arbiter_cosign_public_key: "/etc/arbiter/cosign/cosign.pub"
    cosign_version: "2.4.1"
    quadlet_dir: "/etc/containers/systemd"
    quay_robot_user: "{{ vault_quay_robot_user | default('') }}"
    quay_robot_token: "{{ vault_quay_robot_token | default('') }}"
    arbiter_repo: "https://github.com/Amy-Ra-lph/arbiter-hub.git"
    arbiter_repo_branch: "main"
  tasks:
    - name: Install podman
      ansible.builtin.dnf:
        name:
          - podman
          - python3-podman
        state: present

    - name: Install cosign binary
      ansible.builtin.get_url:
        url: "https://github.com/sigstore/cosign/releases/download/v{{ cosign_version }}/cosign-linux-amd64"
        dest: /usr/local/bin/cosign
        mode: "0755"
      register: cosign_install
      retries: 3
      delay: 5
      until: cosign_install is not failed

    - name: Create cosign key directory
      ansible.builtin.file:
        path: /etc/arbiter/cosign
        state: directory
        mode: "0750"

    - name: Generate cosign keypair for image verification
      ansible.builtin.command:
        cmd: cosign generate-key-pair
        chdir: /etc/arbiter/cosign
      environment:
        COSIGN_PASSWORD: ""
      args:
        creates: /etc/arbiter/cosign/cosign.pub

    - name: Mount cosign keys into API container
      ansible.builtin.file:
        path: /etc/arbiter/cosign
        state: directory
        mode: "0750"

    - name: Pull container images
      containers.podman.podman_image:
        name: "{{ item }}"
        state: present
      loop:
        - "{{ arbiter_api_image }}"
        - "{{ arbiter_mcp_image }}"
        - "{{ arbiter_db_image }}"

    - name: Login to Quay for cosign signature push
      ansible.builtin.command:
        cmd: podman login quay.io -u {{ quay_robot_user }} -p {{ quay_robot_token }}
      when: quay_robot_user | length > 0
      no_log: true

    - name: Sign container images with cosign
      ansible.builtin.command:
        cmd: >-
          cosign sign --key /etc/arbiter/cosign/cosign.key
          --tlog-upload=false
          {{ item }}
      environment:
        COSIGN_PASSWORD: ""
      loop:
        - "{{ arbiter_api_image }}"
        - "{{ arbiter_mcp_image }}"
      register: cosign_sign
      changed_when: "'Pushing signature' in cosign_sign.stderr"
      when: quay_robot_user | length > 0

    - name: Clone arbiter-hub repo
      ansible.builtin.git:
        repo: "{{ arbiter_repo }}"
        dest: /opt/arbiter-hub
        version: "{{ arbiter_repo_branch }}"
        depth: 1
        force: true

    - name: Create podman secret for DB password
      containers.podman.podman_secret:
        name: arbiter-hub-db-password
        data: "{{ arbiter_db_password }}"
        state: present
      no_log: true

    - name: Create cert directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
      loop:
        - /etc/arbiter/certs
        - "{{ arbiter_cert_dir }}"

    - name: Deploy Quadlet network (non-internal for cross-host access)
      ansible.builtin.copy:
        dest: "{{ quadlet_dir }}/arbiter-hub.network"
        content: |
          [Network]
          Driver=bridge
          Internal=false
        mode: "0644"
      notify: reload systemd

    - name: Copy Quadlet volume and container files
      ansible.builtin.copy:
        src: "/opt/arbiter-hub/deploy/quadlet/{{ item }}"
        dest: "{{ quadlet_dir }}/{{ item }}"
        mode: "0644"
        remote_src: true
      loop:
        - arbiter-hub-db.volume
        - arbiter-hub-certs.volume
        - arbiter-hub-keylime.volume
        - arbiter-hub-db.container
        - arbiter-hub-mcp.container
      notify: reload systemd

    - name: Copy seed policy data for API container
      ansible.builtin.copy:
        src: /opt/arbiter-hub/deploy/seed/policies.json
        dest: /etc/arbiter/seed-policies.json
        remote_src: true
        mode: "0644"

    - name: Template API container with verifier hostname resolution
      ansible.builtin.copy:
        dest: "{{ quadlet_dir }}/arbiter-hub-api.container"
        content: |
          [Unit]
          Description=Arbiter Hub API Server
          After=arbiter-hub-db.container
          Requires=arbiter-hub-db.container

          [Container]
          Image={{ arbiter_api_image }}
          ContainerName=arbiter-hub-api
          Network=arbiter-hub.network
          PublishPort=8400:8400
          AddHost={{ arbiter_keylime_verifier_host }}:{{ arbiter_keylime_verifier_ip }}
          AddHost={{ arbiter_agent_host }}:{{ arbiter_agent_ip }}
          Volume=arbiter-hub-certs.volume:/etc/arbiter/certs:ro,Z
          Volume={{ arbiter_cert_dir }}:/etc/arbiter/keylime:ro,Z
          Volume=/etc/arbiter/cosign:/etc/arbiter/cosign:ro,Z
          Volume=/usr/local/bin/cosign:/usr/local/bin/cosign:ro,Z
          Volume=/etc/arbiter/seed-policies.json:/etc/arbiter/seed-policies.json:ro,Z
          Environment=ARBITER_DATABASE_URL=postgresql+asyncpg://{{ arbiter_db_user }}:{{ arbiter_db_password }}@arbiter-hub-db:5432/{{ arbiter_db_name }}
          Environment=ARBITER_KEYLIME_VERIFIER_URL={{ arbiter_keylime_verifier_url }}
          Environment=ARBITER_KEYLIME_CA_CERT=/etc/arbiter/keylime/ca.crt
          Environment=ARBITER_KEYLIME_CLIENT_CERT=/etc/arbiter/keylime/client.crt
          Environment=ARBITER_KEYLIME_CLIENT_KEY=/etc/arbiter/keylime/client.key
          Environment=ARBITER_FALCO_HEALTHZ_URL={{ arbiter_falco_healthz_url }}
          Environment=ARBITER_COSIGN_PUBLIC_KEY={{ arbiter_cosign_public_key }}
          Environment=ARBITER_COSIGN_INSECURE_IGNORE_TLOG=true
          SecurityLabelDisable=true

          [Service]
          Restart=always

          [Install]
          WantedBy=multi-user.target default.target
        mode: "0644"
      notify: reload systemd

    - name: Flush handlers before starting services
      ansible.builtin.meta: flush_handlers

    - name: Start database
      ansible.builtin.systemd:
        name: arbiter-hub-db
        state: started
        enabled: true

    - name: Wait for database readiness
      ansible.builtin.command:
        cmd: >-
          podman exec arbiter-hub-db
          pg_isready -U {{ arbiter_db_user }} -d {{ arbiter_db_name }}
      register: pg_ready
      retries: 12
      delay: 5
      until: pg_ready.rc == 0
      changed_when: false

    - name: Run Alembic migrations (sed-patch alembic.ini for network DB host)
      ansible.builtin.command:
        cmd: >-
          podman run --rm
          --network systemd-arbiter-hub
          --entrypoint sh
          -e ARBITER_DATABASE_URL=postgresql+asyncpg://{{ arbiter_db_user }}:{{ arbiter_db_password }}@arbiter-hub-db:5432/{{ arbiter_db_name }}
          {{ arbiter_api_image }}
          -c "sed -i 's|arbiter:arbiter@localhost|{{ arbiter_db_user }}:{{ arbiter_db_password }}@arbiter-hub-db|' alembic.ini && python3.12 -m alembic upgrade head"
      register: alembic_result
      changed_when: "'Running upgrade' in alembic_result.stderr"

    - name: Start API
      ansible.builtin.systemd:
        name: arbiter-hub-api
        state: started
        enabled: true

    - name: Wait for API health (via container IP)
      ansible.builtin.command:
        cmd: >-
          podman exec arbiter-hub-api
          python3.12 -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8400/health', timeout=5); print(r.read().decode())"
      register: health
      retries: 10
      delay: 3
      until: health.rc == 0
      changed_when: false

    - name: Seed attestation policies (idempotent)
      ansible.builtin.command:
        cmd: >-
          podman exec arbiter-hub-api
          python3.12 -c "
          import json, urllib.request;
          policies = json.load(open('/etc/arbiter/seed-policies.json'));
          existing = json.loads(urllib.request.urlopen('http://127.0.0.1:8400/policies').read())['items'];
          names = {p['name'] for p in existing};
          created = 0;
          [created := created + 1 or urllib.request.urlopen(
              urllib.request.Request('http://127.0.0.1:8400/policies',
              data=json.dumps(p).encode(), headers={'Content-Type': 'application/json'}, method='POST'))
           for p in policies if p['name'] not in names];
          print(f'Seeded {created} new policies ({len(names)} already existed)')
          "
      register: seed_result
      changed_when: "'Seeded 0' not in seed_result.stdout"

    - name: Start MCP
      ansible.builtin.systemd:
        name: arbiter-hub-mcp
        state: started
        enabled: true

    - name: Verify all containers running
      ansible.builtin.command:
        cmd: podman ps --format '{{ '{{' }}.Names{{ '}}' }}' --filter name=arbiter-hub
      register: running_containers
      changed_when: false
      failed_when: >-
        'arbiter-hub-db' not in running_containers.stdout or
        'arbiter-hub-api' not in running_containers.stdout or
        'arbiter-hub-mcp' not in running_containers.stdout

  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

- name: Copy Keylime verifier certs to hub for API mTLS
  hosts: arbiter_hub
  become: true
  vars:
    arbiter_cert_dir: "/etc/arbiter/keylime"
    verifier_host: "{{ groups['ipaserver'][0] }}"
  tasks:
    - name: Fetch verifier CA cert
      ansible.builtin.slurp:
        src: /var/lib/keylime/cv_ca/cacert.crt
      delegate_to: "{{ verifier_host }}"
      register: verifier_ca

    - name: Fetch verifier client cert
      ansible.builtin.slurp:
        src: /var/lib/keylime/cv_ca/client-cert.crt
      delegate_to: "{{ verifier_host }}"
      register: verifier_client_cert

    - name: Fetch verifier client key
      ansible.builtin.slurp:
        src: /var/lib/keylime/cv_ca/client-private.pem
      delegate_to: "{{ verifier_host }}"
      register: verifier_client_key

    - name: Write CA cert
      ansible.builtin.copy:
        dest: "{{ arbiter_cert_dir }}/ca.crt"
        content: "{{ verifier_ca.content | b64decode }}"
        mode: "0644"

    - name: Write client cert
      ansible.builtin.copy:
        dest: "{{ arbiter_cert_dir }}/client.crt"
        content: "{{ verifier_client_cert.content | b64decode }}"
        mode: "0644"

    - name: Write client key
      ansible.builtin.copy:
        dest: "{{ arbiter_cert_dir }}/client.key"
        content: "{{ verifier_client_key.content | b64decode }}"
        mode: "0640"

    - name: Restart API to pick up certs
      ansible.builtin.systemd:
        name: arbiter-hub-api
        state: restarted

- name: Deploy arbiter-hub UI via nginx
  hosts: arbiter_hub
  become: true
  vars:
    arbiter_ui_image: "docker.io/library/nginx:alpine"
    arbiter_repo_dir: /opt/arbiter-hub
  tasks:
    - name: Build UI (requires node/npm) or use pre-built dist
      ansible.builtin.stat:
        path: "{{ arbiter_repo_dir }}/ui/dist/index.html"
      register: ui_dist

    - name: Upload pre-built UI dist from controller
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../ui/dist/"
        dest: "{{ arbiter_repo_dir }}/ui/dist/"
        mode: "0644"
      when: not ui_dist.stat.exists

    - name: Deploy nginx config for UI
      ansible.builtin.copy:
        src: "{{ arbiter_repo_dir }}/deploy/nginx/nginx.conf"
        dest: "{{ arbiter_repo_dir }}/deploy/nginx/nginx.conf"
        remote_src: true
        mode: "0644"

    - name: Pull nginx image
      ansible.builtin.command:
        cmd: podman pull {{ arbiter_ui_image }}
      register: pull_result
      changed_when: "'Pulling' in pull_result.stderr"

    - name: Stop existing UI container
      ansible.builtin.command:
        cmd: podman rm -f arbiter-hub-ui
      failed_when: false
      changed_when: true

    - name: Start UI container
      ansible.builtin.command:
        cmd: >-
          podman run -d
          --name arbiter-hub-ui
          --network systemd-arbiter-hub
          -p 8443:8080
          -v {{ arbiter_repo_dir }}/ui/dist:/opt/app-root/src:ro,Z
          -v {{ arbiter_repo_dir }}/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
          {{ arbiter_ui_image }}
      register: ui_start

    - name: Wait for UI
      ansible.builtin.wait_for:
        port: 8443
        timeout: 15

    - name: Verify UI serves dashboard
      ansible.builtin.uri:
        url: http://localhost:8443/
        status_code: 200
      register: ui_check

    - name: Verify API proxy works through nginx
      ansible.builtin.uri:
        url: http://localhost:8443/api/health
        status_code: 200
      register: proxy_check

    - name: Deploy UI→API health-check script
      ansible.builtin.copy:
        src: "{{ arbiter_repo_dir }}/scripts/ui-api-healthcheck.sh"
        dest: /opt/arbiter-hub/scripts/ui-api-healthcheck.sh
        remote_src: true
        mode: "0755"

    - name: Create health-check systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/arbiter-ui-healthcheck.service
        mode: "0644"
        content: |
          [Unit]
          Description=Arbiter Hub UI→API health check and auto-remediation
          [Service]
          Type=oneshot
          ExecStart=/opt/arbiter-hub/scripts/ui-api-healthcheck.sh

    - name: Create health-check systemd timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/arbiter-ui-healthcheck.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Run Arbiter Hub UI health check every 30 seconds
          [Timer]
          OnBootSec=60s
          OnUnitActiveSec=30s
          AccuracySec=5s
          [Install]
          WantedBy=timers.target

    - name: Enable health-check timer
      ansible.builtin.systemd:
        name: arbiter-ui-healthcheck.timer
        state: started
        enabled: true
        daemon_reload: true

    - name: Display UI status
      ansible.builtin.debug:
        msg: "UI: http://{{ ansible_fqdn }}:8443 — API proxy: {{ proxy_check.status }} — healthcheck timer: active"
