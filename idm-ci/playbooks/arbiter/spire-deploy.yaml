---
# spire-deploy.yaml — Deploy SPIRE server + agent for workload identity
# Server on ipaserver node, agent on agent node.
# JWT-SVID federation with ahdapa for workload→IdP identity bridging.
- name: Deploy SPIRE server
  hosts: ipaserver
  become: true
  vars:
    spire_version: "1.11.1"
    spire_install_dir: /opt/spire
    spire_data_dir: /var/lib/spire/server
    spire_conf_dir: /etc/spire/server
    trust_domain: "arbiter.demo"
    ahdapa_issuer: "https://{{ ansible_fqdn }}/idp"
  tasks:
    - name: Create spire user
      ansible.builtin.user:
        name: spire
        system: true
        shell: /sbin/nologin
        home: "{{ spire_data_dir }}"

    - name: Create SPIRE directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: spire
        group: spire
        mode: "0750"
      loop:
        - "{{ spire_install_dir }}"
        - "{{ spire_data_dir }}"
        - "{{ spire_conf_dir }}"

    - name: Download SPIRE release
      ansible.builtin.unarchive:
        src: "https://github.com/spiffe/spire/releases/download/v{{ spire_version }}/spire-{{ spire_version }}-linux-amd64-musl.tar.gz"
        dest: "{{ spire_install_dir }}"
        remote_src: true
        creates: "{{ spire_install_dir }}/spire-{{ spire_version }}/bin/spire-server"

    - name: Symlink SPIRE binaries
      ansible.builtin.file:
        src: "{{ spire_install_dir }}/spire-{{ spire_version }}/bin/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        state: link
      loop:
        - spire-server
        - spire-agent

    - name: Deploy SPIRE server config
      ansible.builtin.copy:
        dest: "{{ spire_conf_dir }}/server.conf"
        owner: spire
        group: spire
        mode: "0640"
        content: |
          server {
              bind_address = "0.0.0.0"
              bind_port = "8081"
              trust_domain = "{{ trust_domain }}"
              jwt_issuer = "{{ ahdapa_issuer | regex_replace('/idp$', '/spire') }}"
              data_dir = "{{ spire_data_dir }}"
              log_level = "INFO"

              ca_ttl = "24h"
              default_x509_svid_ttl = "1h"
              default_jwt_svid_ttl = "5m"
          }

          plugins {
              DataStore "sql" {
                  plugin_data {
                      database_type = "sqlite3"
                      connection_string = "{{ spire_data_dir }}/datastore.sqlite3"
                  }
              }

              NodeAttestor "join_token" {
                  plugin_data {}
              }

              KeyManager "disk" {
                  plugin_data {
                      keys_path = "{{ spire_data_dir }}/keys.json"
                  }
              }
          }
      notify: restart spire-server

    - name: Deploy SPIRE server systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/spire-server.service
        mode: "0644"
        content: |
          [Unit]
          Description=SPIRE Server
          After=network-online.target

          [Service]
          Type=simple
          User=spire
          Group=spire
          ExecStart=/usr/local/bin/spire-server run -config {{ spire_conf_dir }}/server.conf
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Start SPIRE server
      ansible.builtin.systemd:
        name: spire-server
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for SPIRE server health
      ansible.builtin.command:
        cmd: spire-server healthcheck -socketPath /tmp/spire-server/private/api.sock
      register: spire_health
      retries: 15
      delay: 5
      until: spire_health.rc == 0
      changed_when: false

    - name: Generate join token for agent node
      ansible.builtin.command:
        cmd: >-
          spire-server token generate
          -spiffeID spiffe://{{ trust_domain }}/agent/arbiter-agent
          -socketPath /tmp/spire-server/private/api.sock
          -ttl 600
      register: join_token_result
      changed_when: true

    - name: Extract join token
      ansible.builtin.set_fact:
        spire_join_token: "{{ join_token_result.stdout | regex_search('Token: (.+)', '\\1') | first }}"

  handlers:
    - name: restart spire-server
      ansible.builtin.systemd:
        name: spire-server
        state: restarted

- name: Deploy SPIRE agent
  hosts: arbiter_agent
  become: true
  vars:
    spire_version: "1.11.1"
    spire_install_dir: /opt/spire
    spire_data_dir: /var/lib/spire/agent
    spire_conf_dir: /etc/spire/agent
    trust_domain: "arbiter.demo"
    spire_server_host: "{{ hostvars[groups['ipaserver'][0]]['ansible_fqdn'] }}"
    spire_join_token: "{{ hostvars[groups['ipaserver'][0]]['spire_join_token'] }}"
  tasks:
    - name: Create spire user
      ansible.builtin.user:
        name: spire
        system: true
        shell: /sbin/nologin
        home: "{{ spire_data_dir }}"

    - name: Create SPIRE agent directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: spire
        group: spire
        mode: "0750"
      loop:
        - "{{ spire_install_dir }}"
        - "{{ spire_data_dir }}"
        - "{{ spire_conf_dir }}"

    - name: Download SPIRE release
      ansible.builtin.unarchive:
        src: "https://github.com/spiffe/spire/releases/download/v{{ spire_version }}/spire-{{ spire_version }}-linux-amd64-musl.tar.gz"
        dest: "{{ spire_install_dir }}"
        remote_src: true
        creates: "{{ spire_install_dir }}/spire-{{ spire_version }}/bin/spire-agent"

    - name: Symlink SPIRE agent binary
      ansible.builtin.file:
        src: "{{ spire_install_dir }}/spire-{{ spire_version }}/bin/spire-agent"
        dest: /usr/local/bin/spire-agent
        state: link

    - name: Deploy SPIRE agent config
      ansible.builtin.copy:
        dest: "{{ spire_conf_dir }}/agent.conf"
        owner: spire
        group: spire
        mode: "0640"
        content: |
          agent {
              data_dir = "{{ spire_data_dir }}"
              log_level = "INFO"
              server_address = "{{ spire_server_host }}"
              server_port = "8081"
              trust_domain = "{{ trust_domain }}"
              trust_bundle_path = "{{ spire_data_dir }}/bootstrap.crt"
          }

          plugins {
              NodeAttestor "join_token" {
                  plugin_data {}
              }

              KeyManager "disk" {
                  plugin_data {
                      directory = "{{ spire_data_dir }}/keys"
                  }
              }

              WorkloadAttestor "unix" {
                  plugin_data {
                      discover_workload_path = true
                  }
              }
          }
    - name: Fetch SPIRE server bundle via CLI
      ansible.builtin.command:
        cmd: >-
          spire-server bundle show
          -socketPath /tmp/spire-server/private/api.sock
      delegate_to: "{{ spire_server_host }}"
      register: spire_bundle
      changed_when: false
      failed_when: false

    - name: Write SPIRE server bundle
      ansible.builtin.copy:
        content: "{{ spire_bundle.stdout }}"
        dest: "{{ spire_data_dir }}/bootstrap.crt"
        owner: spire
        group: spire
        mode: "0640"
      when: spire_bundle.rc == 0

    - name: Copy IPA CA as bootstrap cert (fallback)
      ansible.builtin.copy:
        src: /etc/ipa/ca.crt
        dest: "{{ spire_data_dir }}/bootstrap.crt"
        remote_src: true
        force: false
        owner: spire
        group: spire
        mode: "0640"
      when: spire_bundle.rc != 0

    - name: Deploy SPIRE agent systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/spire-agent.service
        mode: "0644"
        content: |
          [Unit]
          Description=SPIRE Agent
          After=network-online.target

          [Service]
          Type=simple
          User=spire
          Group=spire
          ExecStart=/usr/local/bin/spire-agent run -config {{ spire_conf_dir }}/agent.conf -joinToken {{ spire_join_token }}
          Restart=on-failure
          RestartSec=5
          AmbientCapabilities=CAP_SYS_PTRACE

          [Install]
          WantedBy=multi-user.target

    - name: Start SPIRE agent
      ansible.builtin.systemd:
        name: spire-agent
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for agent attestation
      ansible.builtin.command:
        cmd: spire-agent healthcheck -socketPath /tmp/spire-agent/public/api.sock
      register: agent_health
      retries: 15
      delay: 5
      until: agent_health.rc == 0
      changed_when: false

- name: Verify SPIRE agent registration
  hosts: ipaserver
  become: true
  vars:
    spire_data_dir: /var/lib/spire/server
  tasks:
    - name: List registered agents
      ansible.builtin.command:
        cmd: spire-server agent list -socketPath /tmp/spire-server/private/api.sock
      register: agent_list
      changed_when: false

    - name: Verify agent is attested
      ansible.builtin.assert:
        that:
          - "'arbiter-agent' in agent_list.stdout"
        fail_msg: "SPIRE agent not registered with server"

    - name: Display registered agents
      ansible.builtin.debug:
        var: agent_list.stdout_lines

    - name: Register workload entries
      ansible.builtin.command:
        cmd: >-
          spire-server entry create
          -parentID spiffe://{{ trust_domain }}/agent/arbiter-agent
          -spiffeID spiffe://{{ trust_domain }}/workload/{{ item.name }}
          -selector unix:uid:0
          -socketPath /tmp/spire-server/private/api.sock
      loop:
        - { name: enforcement-mcp }
        - { name: linux-mcp }
        - { name: governed-agent }
      register: entry_result
      changed_when: "'Entry ID' in entry_result.stdout"
      failed_when: "entry_result.rc != 0 and 'already exists' not in entry_result.stderr"

    - name: Export SPIRE JWKS for ahdapa federation
      ansible.builtin.shell: |
        spire-server bundle show -output json \
          -socketPath /tmp/spire-server/private/api.sock \
          | python3 -c "
        import sys, json, base64
        bundle = json.load(sys.stdin)
        keys = []
        for k in bundle.get('jwt_authorities', []):
            pub = k.get('public_key', '')
            from cryptography.hazmat.primitives.serialization import load_der_public_key
            from cryptography.hazmat.primitives.asymmetric.ec import EllipticCurvePublicNumbers
            pk = load_der_public_key(base64.b64decode(pub))
            nums = pk.public_numbers()
            x = base64.urlsafe_b64encode(nums.x.to_bytes(32, 'big')).rstrip(b'=').decode()
            y = base64.urlsafe_b64encode(nums.y.to_bytes(32, 'big')).rstrip(b'=').decode()
            keys.append({'kty':'EC','crv':'P-256','x':x,'y':y,'use':'sig','alg':'ES256','kid':k.get('key_id','')})
        print(json.dumps({'keys':keys}, indent=2))
        "
      register: spire_jwks
      changed_when: false

    - name: Serve SPIRE JWKS via httpd
      ansible.builtin.copy:
        content: "{{ spire_jwks.stdout }}"
        dest: /var/www/html/.well-known/spire-jwks.json
        mode: "0644"

    - name: Deploy SPIRE JWKS httpd config
      ansible.builtin.copy:
        dest: /etc/httpd/conf.d/spire-jwks.conf
        mode: "0644"
        content: |
          Alias "/.well-known/spire-jwks.json" "/var/www/html/.well-known/spire-jwks.json"
          <Location "/.well-known/spire-jwks.json">
              Require all granted
              Header set Content-Type "application/json"
              Header set Access-Control-Allow-Origin "*"
          </Location>
      notify: reload httpd

    - name: Deploy SPIRE OIDC discovery endpoint
      ansible.builtin.copy:
        dest: /var/www/html/spire/.well-known/openid-configuration
        mode: "0644"
        content: |
          {
            "issuer": "{{ ahdapa_issuer | regex_replace('/idp$', '/spire') }}",
            "jwks_uri": "https://{{ ansible_fqdn }}/.well-known/spire-jwks.json",
            "response_types_supported": ["id_token"],
            "subject_types_supported": ["public"],
            "id_token_signing_alg_values_supported": ["ES256"]
          }

    - name: Create SPIRE discovery directory
      ansible.builtin.file:
        path: /var/www/html/spire/.well-known
        state: directory
        mode: "0755"

    - name: Deploy SPIRE OIDC discovery httpd config
      ansible.builtin.copy:
        dest: /etc/httpd/conf.d/spire-oidc-discovery.conf
        mode: "0644"
        content: |
          Alias "/spire/.well-known/openid-configuration" "/var/www/html/spire/.well-known/openid-configuration"
          <Location "/spire/.well-known/openid-configuration">
              Require all granted
              Header set Content-Type "application/json"
          </Location>
      notify: reload httpd

  handlers:
    - name: reload httpd
      ansible.builtin.systemd:
        name: httpd
        state: reloaded
