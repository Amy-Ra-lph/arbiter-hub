---
# siem-bridge-deploy.yaml — Deploy Falco→SIEM bridge with OCSF normalization
# Converts Falco JSON alerts to OCSF format, forwards via rsyslog
- name: Deploy Falco-SIEM bridge and OCSF forwarder
  hosts: arbiter_agent
  become: true
  vars:
    bridge_dir: /opt/demo/bridge
    hub_api_url: "http://hub.arbiter.demo:8400"
    bridge_src: "{{ playbook_dir }}/../../../beaker/ansible"
  tasks:
    - name: Create bridge directory
      ansible.builtin.file:
        path: "{{ bridge_dir }}"
        state: directory
        mode: "0755"

    - name: Upload Falco-SIEM bridge scripts
      ansible.builtin.copy:
        src: "{{ bridge_src }}/{{ item }}"
        dest: "{{ bridge_dir }}/{{ item }}"
        mode: "0755"
      loop:
        - falco_siem_bridge.py
        - falco-eda-bridge.py
      ignore_errors: true

    - name: Create OCSF log directory
      ansible.builtin.file:
        path: /var/log/ocsf
        state: directory
        mode: "0750"

    - name: Deploy Falco-SIEM bridge systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/falco-siem-bridge.service
        mode: "0644"
        content: |
          [Unit]
          Description=Falco to SIEM Bridge (OCSF normalization)
          After=falco.service
          Wants=falco.service

          [Service]
          Type=simple
          WorkingDirectory={{ bridge_dir }}
          ExecStart=/usr/bin/python3 {{ bridge_dir }}/falco_siem_bridge.py
          Environment=ARBITER_API_URL={{ hub_api_url }}
          Environment=OCSF_LOG_DIR=/var/log/ocsf
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target

    - name: Start Falco-SIEM bridge
      ansible.builtin.systemd:
        name: falco-siem-bridge
        state: started
        enabled: true
        daemon_reload: true
      ignore_errors: true

    - name: Verify bridge process
      ansible.builtin.command:
        cmd: systemctl is-active falco-siem-bridge
      register: bridge_status
      changed_when: false
      failed_when: false

    - name: Display bridge status
      ansible.builtin.debug:
        msg: "Falco-SIEM bridge: {{ bridge_status.stdout }}"
