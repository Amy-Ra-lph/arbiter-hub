---
# obo-exchange-deploy.yaml — Configure federation token exchange policies
# Uses ahdapactl federation-policies (not ahdapa-exchange-register which doesn't exist).
# Token exchange endpoint is /idp/token with grant_type=urn:ietf:params:oauth:grant-type:token-exchange.
- name: Configure OBO token exchange
  hosts: ipaserver
  become: true
  vars:
    ipa_admin_password: "{{ ipaserver_admin_password }}"
    ahdapa_url: "https://{{ ansible_fqdn }}/idp"
  tasks:
    - name: Obtain admin Kerberos ticket
      ansible.builtin.command:
        cmd: kinit admin
        stdin: "{{ ipa_admin_password }}"
      changed_when: false

    - name: Login to ahdapa
      ansible.builtin.command:
        cmd: ahdapactl login {{ ahdapa_url }} --kerberos --insecure
      register: ahdapa_login
      changed_when: "'logged in' in ahdapa_login.stdout"
      failed_when: ahdapa_login.rc != 0 and 'already logged in' not in ahdapa_login.stderr

    - name: List existing federation policies
      ansible.builtin.command:
        cmd: ahdapactl federation-policies list
      register: existing_policies
      changed_when: false

    - name: Create federation policy for arbiter-hub workload exchange
      ansible.builtin.command:
        cmd: >-
          ahdapactl federation-policies create
          --issuer {{ ahdapa_url }}
          --subject-pattern "arbiter-hub-*"
          --local-sub "arbiter-hub-api"
          --scopes "arbiter:attest,arbiter:enroll,arbiter:view"
          --priority 10
      register: fed_policy
      when: "'arbiter-hub' not in existing_policies.stdout"
      changed_when: fed_policy.rc == 0

    - name: Verify token endpoint responds
      ansible.builtin.uri:
        url: "{{ ahdapa_url }}/token"
        method: POST
        validate_certs: false
        body_format: form-urlencoded
        body:
          grant_type: "urn:ietf:params:oauth:grant-type:token-exchange"
          subject_token_type: "urn:ietf:params:oauth:token-type:access_token"
          subject_token: "test-invalid-token"
        status_code: [400, 401]
      register: exchange_test

    - name: Confirm exchange endpoint responds
      ansible.builtin.assert:
        that:
          - exchange_test.status in [400, 401]
        fail_msg: "Token exchange endpoint not responding at {{ ahdapa_url }}/token"

    - name: Display federation policies
      ansible.builtin.command:
        cmd: ahdapactl federation-policies list
      register: final_policies
      changed_when: false

    - name: Show policies
      ansible.builtin.debug:
        var: final_policies.stdout_lines
