---
# behavioral-audit-deploy.yaml — Deploy behavioral audit classifiers on agent node
# Classifiers analyze agent commands for injection, persistence, and shell patterns
- name: Deploy behavioral audit classifiers
  hosts: arbiter_agent
  become: true
  vars:
    audit_dir: /opt/demo/audit
    audit_src: "{{ playbook_dir }}/../../../audit"
  tasks:
    - name: Create audit directory
      ansible.builtin.file:
        path: "{{ audit_dir }}"
        state: directory
        mode: "0755"

    - name: Upload audit classifiers
      ansible.builtin.copy:
        src: "{{ audit_src }}/{{ item }}"
        dest: "{{ audit_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - __init__.py
        - injection_detector.py
        - persistence_detector.py
        - shell_classifier.py
      ignore_errors: true

    - name: Install classifier dependencies
      ansible.builtin.pip:
        name:
          - pyyaml
        state: present

    - name: Verify classifiers load without errors
      ansible.builtin.command:
        cmd: >-
          python3 -c "
          import sys; sys.path.insert(0, '{{ audit_dir }}');
          from injection_detector import *;
          from persistence_detector import *;
          from shell_classifier import *;
          print('All classifiers loaded')
          "
      register: classifier_check
      changed_when: false
      failed_when: false

    - name: Display classifier status
      ansible.builtin.debug:
        msg: "{{ classifier_check.stdout | default('classifiers not loaded — files may need manual upload from rhel-agentic-security') }}"
