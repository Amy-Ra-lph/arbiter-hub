---
# trust-profiles-deploy.yaml — Deploy trust tier sandbox profiles on agent node
# Profiles define enforcement boundaries for demo workloads
- name: Deploy trust tier sandbox profiles
  hosts: arbiter_agent
  become: true
  vars:
    profiles_dest: /opt/demo/profiles
  tasks:
    - name: Create profiles directory
      ansible.builtin.file:
        path: "{{ profiles_dest }}"
        state: directory
        mode: "0755"

    - name: Upload sandbox profiles
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../profiles/{{ item }}"
        dest: "{{ profiles_dest }}/{{ item }}"
        mode: "0644"
      loop:
        - sovereign.profile
        - verified.profile
        - untrusted.profile
      ignore_errors: true

    - name: Create inline profiles if upload failed
      ansible.builtin.copy:
        dest: "{{ profiles_dest }}/{{ item.name }}"
        mode: "0644"
        content: "{{ item.content }}"
        force: false
      loop:
        - name: sovereign.profile
          content: |
            name: sovereign
            description: "Full isolation, no network, IMA-verified binaries"
            network: none
            filesystem: read-only
            capabilities: []
            credential_access: false
            ima_policy: enforce
        - name: verified.profile
          content: |
            name: verified
            description: "Attested identity, scoped API access, audit trail"
            network: restricted
            filesystem: read-only
            capabilities: [NET_RAW]
            credential_access: scoped
            ima_policy: log
        - name: untrusted.profile
          content: |
            name: untrusted
            description: "Network-gated, read-only fs, no credential access"
            network: gated
            filesystem: read-only
            capabilities: []
            credential_access: false
            ima_policy: log

    - name: Verify profiles deployed
      ansible.builtin.command:
        cmd: ls {{ profiles_dest }}/
      register: profiles_list
      changed_when: false

    - name: Display profiles
      ansible.builtin.debug:
        var: profiles_list.stdout_lines
