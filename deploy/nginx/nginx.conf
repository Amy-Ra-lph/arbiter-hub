worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Dynamic DNS resolution — re-resolves API hostname on every request.
    # Podman/Docker assign new IPs on container restart; static upstream
    # blocks cache the old IP until nginx itself restarts. The $backend
    # variable pattern forces per-request resolution via the resolver.
    # Set resolver to Podman's DNS (10.89.0.1) or Docker's (127.0.0.11).
    resolver 10.89.0.1 valid=5s ipv6=off;

    # HTTPS on 8443 — requires IPA-issued cert mounted at /etc/nginx/certs/
    server {
        listen 8443 ssl;
        server_name hub.arbiter.demo;

        ssl_certificate /etc/nginx/certs/ui.crt;
        ssl_certificate_key /etc/nginx/certs/ui.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /opt/app-root/src;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /api/ {
            set $backend "http://arbiter-hub-api:8400";
            proxy_pass $backend;
            rewrite ^/api/(.*) /$1 break;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            error_page 502 503 504 /api_unavailable.json;
        }

        location = /api_unavailable.json {
            internal;
            default_type application/json;
            return 503 '{"status":"unavailable","detail":"API temporarily unreachable"}';
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # HTTP on 8080 — no redirect, serves content normally
    server {
        listen 8080;
        server_name _;
        root /opt/app-root/src;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;

        location /api/ {
            set $backend "http://arbiter-hub-api:8400";
            proxy_pass $backend;
            rewrite ^/api/(.*) /$1 break;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            error_page 502 503 504 /api_unavailable.json;
        }

        location = /api_unavailable.json {
            internal;
            default_type application/json;
            return 503 '{"status":"unavailable","detail":"API temporarily unreachable, retrying..."}';
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
