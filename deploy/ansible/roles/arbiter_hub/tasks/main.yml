- name: Validate required variables
  ansible.builtin.assert:
    that:
      - arbiter_hub_db_password | length > 0
    fail_msg: "arbiter_hub_db_password must be set — generate a strong password and pass it via inventory or extra-vars"

- name: Create podman secrets
  containers.podman.podman_secret:
    name: "{{ item.name }}"
    data: "{{ item.value }}"
    state: present
  loop:
    - { name: "arbiter-hub-db-password", value: "{{ arbiter_hub_db_password }}" }
    - { name: "arbiter-hub-db-user", value: "{{ arbiter_hub_db_user }}" }
  no_log: true

- name: Copy Quadlet files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ arbiter_hub_quadlet_dir }}/{{ item | basename }}"
    mode: "0644"
  with_fileglob:
    - "../../../quadlet/*"
  notify: reload_systemd

- name: Create certificate volume directory
  ansible.builtin.file:
    path: /etc/arbiter/certs
    state: directory
    mode: "0750"

- name: Run IPA role setup via playbook
  ansible.builtin.command:
    cmd: >-
      ansible-playbook {{ playbook_dir }}/arbiter/ipa-roles.yaml
      -e ipaserver_admin_password={{ arbiter_hub_ipa_admin_password | default('Secret123') }}
    creates: /etc/arbiter/.ipa-roles-configured

- name: Reload systemd and start services
  ansible.builtin.systemd:
    daemon_reload: true
  listen: reload_systemd

- name: Start arbiter-hub-api
  ansible.builtin.systemd:
    name: arbiter-hub-api
    state: started
    enabled: true
