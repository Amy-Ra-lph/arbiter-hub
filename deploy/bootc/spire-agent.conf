agent {
    data_dir = "/var/lib/spire/agent"
    log_level = "INFO"
    server_address = "__SPIRE_SERVER__"
    server_port = "8081"
    trust_domain = "arbiter.demo"
    trust_bundle_path = "/var/lib/spire/agent/bootstrap.crt"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            directory = "/var/lib/spire/agent/keys"
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {
            discover_workload_path = true
        }
    }
}
