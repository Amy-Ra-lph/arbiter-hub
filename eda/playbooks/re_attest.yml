---
- name: Re-attest stale workload
  hosts: "{{ target_host | default('server') }}"
  gather_facts: false
  vars:
    arbiter_api: "{{ arbiter_api_url | default('http://localhost:8400') }}"
    arbiter_admin_password: "{{ arbiter_service_password | default('') }}"

  tasks:
    - name: Obtain service token
      ansible.builtin.uri:
        url: "{{ arbiter_api }}/auth/local"
        method: POST
        body_format: json
        body:
          username: admin
          password: "{{ arbiter_admin_password }}"
        status_code: [200]
      register: auth_result
      when: arbiter_admin_password | length > 0

    - name: Set bearer token
      ansible.builtin.set_fact:
        arbiter_token: "{{ auth_result.json.access_token | default(arbiter_bearer_token | default('')) }}"

    - name: Trigger re-attestation
      ansible.builtin.uri:
        url: "{{ arbiter_api }}/workloads/{{ workload_id }}/attest"
        method: POST
        headers:
          Authorization: "Bearer {{ arbiter_token }}"
          Content-Type: application/json
        status_code: [200, 409, 503]
      register: attest_result

    - name: Log re-attestation result
      ansible.builtin.debug:
        msg: >-
          Re-attestation for {{ workload_id }}:
          verdict={{ attest_result.json.verdict | default('unknown') }},
          state={{ attest_result.json.state | default('unknown') }}
