---
- name: Quarantine failed workload
  hosts: "{{ target_host | default('server') }}"
  gather_facts: false
  vars:
    arbiter_api: "{{ arbiter_api_url | default('http://localhost:8400') }}"
    arbiter_token: "{{ arbiter_bearer_token | default('') }}"

  tasks:
    - name: Disconnect container from network
      ansible.builtin.command:
        cmd: podman network disconnect podman {{ workload_id }}
      register: disconnect_result
      changed_when: disconnect_result.rc == 0
      failed_when: false

    - name: Notify Arbiter Hub of remediation
      ansible.builtin.uri:
        url: "{{ arbiter_api }}/workloads/{{ workload_id }}/remediate"
        method: POST
        headers:
          Authorization: "Bearer {{ arbiter_token }}"
          Content-Type: application/json
        body_format: json
        body:
          justification: "Auto-quarantined: {{ reason | default('attestation failure') }}"
        status_code: [200, 409]
      register: remediate_result

    - name: Log quarantine action
      ansible.builtin.debug:
        msg: >-
          Workload {{ workload_id }} quarantined.
          Reason: {{ reason | default('unknown') }}.
          Remediation status: {{ remediate_result.status | default('unknown') }}
